<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOZI RADAR | 战局雷达控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"MiSans"', '"Microsoft YaHei"', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
        }

        .glass {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        #map-shell {
            touch-action: none;
        }

        #map-shell.is-dragging {
            cursor: grabbing;
        }

        #map-shell:not(.is-dragging) {
            cursor: grab;
        }

        #map-viewport {
            pointer-events: none;
        }

        canvas {
            image-rendering: optimizeQuality;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-slate-100">
    <div class="flex min-h-screen flex-col">
        <header class="px-6 py-5">
            <div
                class="glass flex items-center justify-between rounded-3xl border border-slate-800/60 bg-slate-950/70 px-6 py-5 shadow-[0_30px_100px_-60px_rgba(16,185,129,0.45)]">
                <div class="flex items-center gap-5">
                    <img src="static/default.png" alt="HOOZI LOGO" class="h-12 w-12 rounded-2xl border border-slate-800/70">
                    <div class="space-y-1">
                        <p class="text-xs uppercase tracking-[0.45em] text-slate-500">HOOZI RADAR</p>
                        <div class="flex flex-wrap items-center gap-3">
                            <span class="text-xl font-semibold text-slate-100">战局雷达控制台</span>
                            <span class="flex items-center gap-2 text-sm text-slate-400">
                                <span id="status-badge"
                                    class="inline-flex h-3 w-3 rounded-full bg-amber-400 shadow-[0_0_14px_rgba(245,158,11,0.5)] transition-all duration-300"></span>
                                <span id="status-text">正在连接...</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-3 sm:flex-row sm:items-center">
                    <div class="flex flex-col text-right text-xs text-slate-500 sm:hidden">
                        <span>焦点玩家</span>
                        <span id="focus-player" class="text-sm font-medium text-slate-100">-</span>
                    </div>
                    <select id="sel_player"
                        class="min-w-[170px] appearance-none rounded-2xl border border-slate-700 bg-slate-900/70 px-4 py-2 text-sm text-slate-100 shadow-inner shadow-slate-950/40 transition hover:border-emerald-400 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                        <option value="<hoozi>">hoozi</option>
                    </select>
                    <div class="hidden flex-col text-right text-xs text-slate-500 sm:flex">
                        <span>焦点玩家</span>
                        <span id="focus-player-desktop" class="text-sm font-medium text-slate-100">-</span>
                    </div>
                    <button id="open-settings"
                        class="rounded-2xl bg-emerald-500 px-5 py-2 text-sm font-semibold text-slate-950 shadow-lg shadow-emerald-500/40 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                        ⚙ 设置
                    </button>
                </div>
            </div>
        </header>
        <main class="flex flex-1 flex-col gap-6 px-6 pb-8 lg:flex-row">
            <section class="flex-1">
                <div id="map-shell"
                    class="group relative mx-auto flex aspect-square w-full max-w-[960px] flex-col overflow-hidden rounded-[32px] border border-slate-800/60 bg-gradient-to-br from-slate-950/80 via-slate-900/70 to-slate-950/80 shadow-[0_40px_120px_-45px_rgba(16,185,129,0.35)]">
                    <div id="map-viewport" class="absolute inset-0 origin-center">
                        <img id="map_img" alt="雷达地图"
                            class="absolute inset-0 h-full w-full select-none object-cover opacity-0 transition-opacity duration-500" />
                        <canvas id="map_canvas" class="absolute inset-0" width="1080" height="1080"></canvas>
                    </div>
                    <div id="map-loading"
                        class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-slate-950/85 text-slate-400">
                        <div class="h-14 w-14 animate-spin rounded-full border-4 border-emerald-500/30 border-t-emerald-400"></div>
                        <p class="text-sm tracking-[0.45em]">等待地图数据</p>
                    </div>
                    <div class="pointer-events-none absolute inset-x-0 top-0 flex justify-between px-6 py-5 text-xs text-slate-400">
                        <div class="pointer-events-auto">
                            <button id="reset-view"
                                class="rounded-full border border-slate-700 bg-slate-900/80 px-4 py-2 text-xs font-semibold text-slate-200 shadow-inner shadow-slate-950/40 transition hover:border-emerald-400 hover:text-emerald-300">重置视图</button>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <span id="map-label" class="text-sm font-semibold text-slate-100">地图 -</span>
                            <span id="map-meta" class="text-xs text-slate-500">等待数据</span>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="w-full max-w-[420px] space-y-6">
                <div
                    class="rounded-[28px] border border-slate-800/60 bg-slate-950/70 p-6 shadow-2xl shadow-emerald-500/10">
                    <h2 class="text-lg font-semibold text-slate-100">实时情报</h2>
                    <dl class="mt-4 space-y-4 text-sm">
                        <div class="flex items-center justify-between">
                            <dt class="text-slate-400">玩家总数</dt>
                            <dd id="player-count" class="text-base font-semibold text-emerald-300">0</dd>
                        </div>
                        <div class="flex items-center justify-between">
                            <dt class="text-slate-400">最后更新</dt>
                            <dd id="last-update" class="text-base text-slate-200">-</dd>
                        </div>
                        <div class="flex flex-col gap-2">
                            <dt class="text-slate-400">过滤规则</dt>
                            <dd id="filter-summary" class="text-sm leading-relaxed text-slate-200">显示所有玩家。</dd>
                        </div>
                    </dl>
                </div>
                <div
                    class="rounded-[28px] border border-slate-800/60 bg-slate-950/60 p-6 text-sm leading-relaxed text-slate-300 shadow-lg">
                    <h3 class="text-base font-semibold text-slate-100">操作提示</h3>
                    <ul class="mt-3 space-y-2 list-disc pl-4 text-slate-400">
                        <li>按住拖拽雷达即可平移，滚轮或双指可缩放。</li>
                        <li>在设置面板中定制要关注的玩家类别与信息。</li>
                        <li>使用焦点玩家选择器快速定位己方队伍。</li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <div id="settings-panel" class="fixed inset-0 z-50 hidden items-center justify-center p-6">
        <div data-close-settings class="absolute inset-0 bg-slate-950/70 backdrop-blur-xl"></div>
        <div
            class="relative z-10 w-full max-w-4xl overflow-hidden rounded-[32px] border border-slate-800/70 bg-slate-950/95 shadow-[0_40px_120px_-40px_rgba(16,185,129,0.35)]">
            <div class="flex items-center justify-between border-b border-slate-800/70 px-8 py-6">
                <div>
                    <p class="text-xs uppercase tracking-[0.35em] text-emerald-400">控制中心</p>
                    <h2 class="text-2xl font-semibold text-slate-100">雷达设置</h2>
                </div>
                <button id="close-settings"
                    class="rounded-full border border-slate-700 bg-slate-900/70 px-4 py-2 text-sm text-slate-300 transition hover:border-emerald-400 hover:text-emerald-200">关闭</button>
            </div>
            <div class="grid gap-8 px-8 py-6 lg:grid-cols-2">
                <section class="space-y-5">
                    <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">连接</h3>
                    <label class="flex flex-col gap-2 text-sm text-slate-300">
                        <span class="text-xs uppercase tracking-[0.3em] text-slate-500">服务器地址</span>
                        <input id="conf_ipaddr" type="text" inputmode="url" placeholder="auto"
                            class="rounded-2xl border border-slate-700 bg-slate-900/60 px-4 py-2 text-slate-100 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" />
                        <span class="text-xs text-slate-500">留空或输入 <code class="rounded bg-slate-800 px-1">auto</code>
                            以自动匹配当前域名。</span>
                    </label>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <label class="flex flex-col gap-2 text-sm text-slate-300">
                            <span class="text-xs uppercase tracking-[0.3em] text-slate-500">字体大小</span>
                            <input id="conf_fontsize" type="number" min="6" max="32" step="1" placeholder="10"
                                class="rounded-2xl border border-slate-700 bg-slate-900/60 px-4 py-2 text-slate-100 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" />
                        </label>
                        <div
                            class="rounded-2xl border border-slate-800/60 bg-slate-900/60 px-4 py-3 text-xs text-slate-400">
                            <p class="font-medium text-slate-200">连接状态</p>
                            <p id="connection-hint" class="mt-1 text-slate-400">等待连接...</p>
                        </div>
                    </div>
                </section>
                <section class="space-y-5">
                    <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">嫌疑条件</h3>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <label class="flex flex-col gap-2 text-sm text-slate-300">
                            <span class="text-xs uppercase tracking-[0.3em] text-slate-500">等级低于</span>
                            <input id="conf_glevel" type="number" min="0" max="9999" step="1" placeholder="250"
                                class="rounded-2xl border border-slate-700 bg-slate-900/60 px-4 py-2 text-slate-100 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" />
                        </label>
                        <label class="flex flex-col gap-2 text-sm text-slate-300">
                            <span class="text-xs uppercase tracking-[0.3em] text-slate-500">击杀高于</span>
                            <input id="conf_gkill" type="number" min="0" max="9999" step="1" placeholder="5"
                                class="rounded-2xl border border-slate-700 bg-slate-900/60 px-4 py-2 text-slate-100 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40" />
                        </label>
                    </div>
                </section>
                <section class="space-y-5">
                    <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">地图显示</h3>
                    <div class="space-y-3 rounded-2xl border border-slate-800/60 bg-slate-900/60 p-4">
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showmp" type="checkbox"
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>仅显示名册玩家位置</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showsp" type="checkbox"
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>仅显示嫌疑玩家位置</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showtp" type="checkbox"
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>仅显示队伍玩家位置</span>
                        </label>
                        <p class="mt-3 rounded-xl bg-slate-900/80 px-3 py-2 text-xs text-slate-400">若未勾选任一选项，则显示全部玩家。</p>
                    </div>
                </section>
                <section class="space-y-5">
                    <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">玩家信息</h3>
                    <div class="space-y-3 rounded-2xl border border-slate-800/60 bg-slate-900/60 p-4">
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showname" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示昵称信息</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showkprefix" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示击杀前缀</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showlprefix" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示等级前缀</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showrankprefix" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示段位信息</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showmprefix" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示名册标识</span>
                        </label>
                        <label class="flex items-center gap-3 text-sm text-slate-200">
                            <input id="conf_showsprefix" type="checkbox" checked
                                class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-emerald-400 focus:ring-emerald-400" />
                            <span>显示嫌疑标识</span>
                        </label>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mapShell = document.getElementById('map-shell');
            const mapViewport = document.getElementById('map-viewport');
            const mapImage = document.getElementById('map_img');
            const canvas = document.getElementById('map_canvas');
            const ctx = canvas.getContext('2d');
            const loadingOverlay = document.getElementById('map-loading');
            const resetViewButton = document.getElementById('reset-view');
            const playerSelect = document.getElementById('sel_player');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const connectionHint = document.getElementById('connection-hint');
            const mapLabel = document.getElementById('map-label');
            const mapMeta = document.getElementById('map-meta');
            const playerCountEl = document.getElementById('player-count');
            const lastUpdateEl = document.getElementById('last-update');
            const focusPlayerMobile = document.getElementById('focus-player');
            const focusPlayerDesktop = document.getElementById('focus-player-desktop');
            const filterSummaryEl = document.getElementById('filter-summary');
            const settingsPanel = document.getElementById('settings-panel');
            const openSettingsBtn = document.getElementById('open-settings');
            const closeSettingsBtn = document.getElementById('close-settings');

            const teamColors = [
                'rgba(255, 200, 200, 1)', 'rgba(200, 255, 200, 1)', 'rgba(200, 200, 255, 1)', 'rgba(255, 255, 200, 1)',
                'rgba(200, 255, 255, 1)', 'rgba(255, 200, 255, 1)', 'rgba(255, 160, 160, 1)', 'rgba(160, 255, 160, 1)',
                'rgba(160, 160, 255, 1)', 'rgba(255, 255, 160, 1)', 'rgba(255, 210, 245, 1)', 'rgba(230, 230, 230, 1)',
                'rgba(255, 220, 180, 1)', 'rgba(255, 190, 220, 1)', 'rgba(220, 255, 200, 1)', 'rgba(200, 190, 255, 1)',
                'rgba(255, 220, 150, 1)', 'rgba(200, 240, 200, 1)', 'rgba(255, 200, 180, 1)', 'rgba(255, 245, 200, 1)',
                'rgba(200, 255, 245, 1)', 'rgba(220, 245, 255, 1)', 'rgba(240, 200, 255, 1)', 'rgba(245, 220, 255, 1)',
                'rgba(250, 220, 255, 1)', 'rgba(200, 245, 255, 1)', 'rgba(230, 245, 255, 1)', 'rgba(255, 200, 200, 1)',
                'rgba(255, 220, 200, 1)', 'rgba(255, 210, 210, 1)', 'rgba(220, 255, 235, 1)', 'rgba(210, 230, 255, 1)',
                'rgba(200, 220, 255, 1)', 'rgba(245, 245, 245, 1)', 'rgba(255, 210, 230, 1)', 'rgba(255, 220, 235, 1)',
                'rgba(255, 230, 240, 1)', 'rgba(255, 200, 240, 1)', 'rgba(220, 255, 220, 1)', 'rgba(210, 255, 220, 1)',
                'rgba(220, 255, 220, 1)', 'rgba(200, 255, 200, 1)', 'rgba(240, 255, 200, 1)', 'rgba(210, 255, 210, 1)',
                'rgba(255, 210, 200, 1)', 'rgba(200, 255, 255, 1)'
            ];

            const localTeamColor = '#FFFFFF';
            const mapNames = {
                1: '地图 1',
                2: '地图 2',
                3: '地图 3',
                4: '地图 4',
                5: '地图 5',
                6: '地图 6'
            };

            const viewState = {
                translateX: 0,
                translateY: 0,
                scale: 1,
                isDragging: false,
                startX: 0,
                startY: 0,
                touchPanId: null,
                lastTouchDistance: null
            };

            const scaleLimits = { min: 0.5, max: 3 };
            let freezeUpdates = false;
            let latestPayload = null;
            let socket = null;
            let reconnectTimer = null;
            let desiredPlayer = localStorage.getItem('sel_player') || '<hoozi>';

            const settingDefinitions = [
                { id: 'conf_ipaddr', defaultValue: 'auto', type: 'text' },
                { id: 'conf_fontsize', defaultValue: '10', type: 'number' },
                { id: 'conf_glevel', defaultValue: '250', type: 'number' },
                { id: 'conf_gkill', defaultValue: '5', type: 'number' },
                { id: 'conf_showmp', defaultValue: false, type: 'checkbox' },
                { id: 'conf_showsp', defaultValue: false, type: 'checkbox' },
                { id: 'conf_showtp', defaultValue: false, type: 'checkbox' },
                { id: 'conf_showname', defaultValue: true, type: 'checkbox' },
                { id: 'conf_showkprefix', defaultValue: true, type: 'checkbox' },
                { id: 'conf_showlprefix', defaultValue: true, type: 'checkbox' },
                { id: 'conf_showrankprefix', defaultValue: true, type: 'checkbox' },
                { id: 'conf_showmprefix', defaultValue: true, type: 'checkbox' },
                { id: 'conf_showsprefix', defaultValue: true, type: 'checkbox' }
            ];

            const getElement = (id) => document.getElementById(id);

            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

            const zoomAt = (centerX, centerY, nextScale) => {
                const newScale = clamp(nextScale, scaleLimits.min, scaleLimits.max);
                const prevScale = viewState.scale;
                if (Math.abs(newScale - prevScale) < 0.0001) {
                    viewState.scale = newScale;
                    applyTransform();
                    return;
                }
                const scaleFactor = newScale / prevScale;
                viewState.translateX = centerX - scaleFactor * (centerX - viewState.translateX);
                viewState.translateY = centerY - scaleFactor * (centerY - viewState.translateY);
                viewState.scale = newScale;
                applyTransform();
            };

            const applyTransform = () => {
                mapViewport.style.transform = `translate(${viewState.translateX}px, ${viewState.translateY}px) scale(${viewState.scale})`;
            };

            const resetView = () => {
                viewState.translateX = 0;
                viewState.translateY = 0;
                viewState.scale = 1;
                applyTransform();
            };

            applyTransform();

            const setStatus = (state, message) => {
                const baseClasses = 'inline-flex h-3 w-3 rounded-full transition-all duration-300';
                const palette = {
                    connecting: 'bg-amber-400 shadow-[0_0_14px_rgba(245,158,11,0.5)]',
                    online: 'bg-emerald-400 shadow-[0_0_16px_rgba(16,185,129,0.6)]',
                    offline: 'bg-rose-500 shadow-[0_0_14px_rgba(244,63,94,0.5)]'
                };
                statusBadge.setAttribute('class', `${baseClasses} ${palette[state] || palette.connecting}`);
                statusText.textContent = message;
                if (connectionHint) {
                    connectionHint.textContent = message;
                }
            };

            const toggleLoading = (show) => {
                if (!loadingOverlay) return;
                if (show) {
                    loadingOverlay.classList.remove('hidden');
                } else {
                    loadingOverlay.classList.add('hidden');
                }
            };

            const getCheckboxValue = (id) => {
                const el = getElement(id);
                return el ? el.checked : false;
            };

            const getNumberValue = (id, fallback = 0) => {
                const el = getElement(id);
                if (!el) return fallback;
                const parsed = parseFloat(el.value);
                return Number.isFinite(parsed) ? parsed : fallback;
            };

            const updateFilterSummary = () => {
                if (!filterSummaryEl) return;
                const segments = [];
                if (getCheckboxValue('conf_showmp')) segments.push('名册玩家');
                if (getCheckboxValue('conf_showsp')) segments.push('嫌疑玩家');
                if (getCheckboxValue('conf_showtp')) segments.push('队伍玩家');
                const level = getElement('conf_glevel')?.value || '—';
                const kills = getElement('conf_gkill')?.value || '—';
                let summary = segments.length ? `仅显示：${segments.join('、')}。` : '显示所有玩家。';
                summary += ` 嫌疑条件：等级低于 ${level}，击杀高于 ${kills}。`;
                filterSummaryEl.textContent = summary;
            };

            const updateFocusPlayer = () => {
                if (!latestPayload || !Array.isArray(latestPayload.players)) {
                    focusPlayerMobile.textContent = '-';
                    focusPlayerDesktop.textContent = '-';
                    return;
                }
                const currentName = playerSelect.value;
                const target = latestPayload.players.find((p) => p.name === currentName);
                if (!target) {
                    focusPlayerMobile.textContent = '-';
                    focusPlayerDesktop.textContent = '-';
                    return;
                }
                const label = `${target.name} · 队伍 ${target.team}`;
                focusPlayerMobile.textContent = label;
                focusPlayerDesktop.textContent = label;
            };

            const teamColor = (teamId) => teamColors[teamId % teamColors.length];

            const drawPlayers = (players) => {
                if (!Array.isArray(players) || players.length === 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                const buffer = document.createElement('canvas');
                buffer.width = canvas.width;
                buffer.height = canvas.height;
                const bctx = buffer.getContext('2d');

                const fontSize = parseInt(getElement('conf_fontsize')?.value || '10', 10) || 10;
                const confGLevel = getNumberValue('conf_glevel', 250);
                const confGKill = getNumberValue('conf_gkill', 5);
                const showRosterOnly = getCheckboxValue('conf_showmp');
                const showSusOnly = getCheckboxValue('conf_showsp');
                const showTeamOnly = getCheckboxValue('conf_showtp');
                const showName = getCheckboxValue('conf_showname');
                const showKills = getCheckboxValue('conf_showkprefix');
                const showLevel = getCheckboxValue('conf_showlprefix');
                const showRank = getCheckboxValue('conf_showrankprefix');
                const showRosterBadge = getCheckboxValue('conf_showmprefix');
                const showSuspiciousBadge = getCheckboxValue('conf_showsprefix');

                const showAll = !showRosterOnly && !showSusOnly && !showTeamOnly;

                let localPlayer = players.find((p) => p.name === playerSelect.value);
                if (!localPlayer && players.length > 0) {
                    localPlayer = players[0];
                    playerSelect.value = localPlayer.name;
                    desiredPlayer = localPlayer.name;
                    localStorage.setItem('sel_player', desiredPlayer);
                    updateFocusPlayer();
                }
                if (!localPlayer) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                const localX = localPlayer.pos.x;
                const localY = localPlayer.pos.y;

                bctx.font = `${fontSize}px "Microsoft YaHei", "PingFang SC", system-ui, sans-serif`;
                bctx.textAlign = 'center';
                bctx.textBaseline = 'middle';

                const textCache = [];

                players.forEach((player) => {
                    const color = player.team === localPlayer.team ? localTeamColor : teamColor(player.team);
                    const x = player.pos.x;
                    const y = player.pos.y;

                    bctx.beginPath();
                    bctx.arc(x, y, 4.5, 0, Math.PI * 2);
                    bctx.fillStyle = color;
                    bctx.fill();
                    bctx.lineWidth = 1;
                    bctx.strokeStyle = '#050505';
                    bctx.stroke();
                    bctx.closePath();

                    if (player.team === localPlayer.team && player.name !== localPlayer.name) {
                        bctx.beginPath();
                        bctx.lineWidth = 1.5;
                        bctx.strokeStyle = color;
                        bctx.moveTo(localX, localY);
                        bctx.lineTo(x, y);
                        bctx.stroke();
                        bctx.closePath();
                    }
                });

                players.forEach((player) => {
                    if (player.name === playerSelect.value) {
                        return;
                    }
                    const color = player.team === localPlayer.team ? localTeamColor : teamColor(player.team);
                    const x = player.pos.x;
                    const y = player.pos.y;
                    const levelLow = player.level < confGLevel;
                    const killHigh = player.kills > confGKill;
                    const isRoster = player.pro || player.white || player.black;

                    if (!showAll) {
                        let showPlayer = false;
                        if (showTeamOnly && player.team === localPlayer.team) {
                            showPlayer = true;
                        }
                        if (showRosterOnly && isRoster) {
                            showPlayer = true;
                        }
                        if (showSusOnly && (levelLow || killHigh)) {
                            showPlayer = true;
                        }
                        if (!showPlayer) return;
                    }

                    let text = '';
                    if (player.team !== localPlayer.team) {
                        if (showRosterBadge && isRoster) {
                            const badge = player.pro ? '权' : player.white ? '白' : player.black ? '黑' : '';
                            if (badge) text += ` [${badge}]`;
                        }
                        if (showSuspiciousBadge && (levelLow || killHigh)) {
                            if (levelLow && killHigh) text += ' [嫌]';
                            else {
                                if (levelLow) text += ' [低级]';
                                if (killHigh) text += ' [高杀]';
                            }
                        }
                        if (showKills) text += ` [K:${player.kills}]`;
                        if (showLevel) text += ` [Lv:${player.level}]`;
                        if (showRank && player.rank) text += ` [${player.rank}]`;
                    }
                    if (showName) {
                        text += ` ${player.name}`;
                    }

                    if (text.length > 38) {
                        text = `${text.substring(0, 38)}...`;
                    }

                    const textHeight = fontSize * 1.2;
                    let adjustedY = y - fontSize;

                    textCache.forEach((cached) => {
                        if (cached.team === player.team) {
                            const dx = Math.abs(cached.cx - x);
                            const dy = Math.abs(cached.cy - adjustedY);
                            if (dx < cached.width / 2 && dy < cached.height) {
                                adjustedY -= cached.height;
                            }
                        }
                    });

                    bctx.lineWidth = 2;
                    bctx.strokeStyle = 'rgba(5,5,5,0.85)';
                    bctx.strokeText(text, x, adjustedY);
                    bctx.fillStyle = color;
                    bctx.fillText(text, x, adjustedY);

                    const textWidth = bctx.measureText(text).width;
                    textCache.push({ cx: x, cy: adjustedY, width: textWidth, height: textHeight, team: player.team });
                });

                bctx.beginPath();
                bctx.lineWidth = 1.5;
                bctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                bctx.moveTo(0, localY);
                bctx.lineTo(canvas.width, localY);
                bctx.moveTo(localX, 0);
                bctx.lineTo(localX, canvas.height);
                bctx.stroke();
                bctx.closePath();

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(buffer, 0, 0);
            };

            const resizeCanvas = () => {
                if (!mapImage.naturalWidth || !mapImage.naturalHeight) {
                    return;
                }
                const width = mapImage.naturalWidth;
                const height = mapImage.naturalHeight;
                canvas.width = width;
                canvas.height = height;
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            };

            const mapMetaInfo = (payload) => {
                if (!payload || !Array.isArray(payload.players)) {
                    mapLabel.textContent = '地图 -';
                    mapMeta.textContent = '等待数据';
                    return;
                }
                const teamCount = new Set(payload.players.map((p) => p.team)).size;
                const mapName = mapNames[payload.map] || `地图 ${payload.map ?? '-'}`;
                mapLabel.textContent = mapName;
                mapMeta.textContent = `#${payload.map ?? '?'} · ${teamCount} 支队伍`;
            };

            const updatePlayersSelect = (players) => {
                if (!Array.isArray(players)) return;
                const fragment = document.createDocumentFragment();
                const sorted = players.slice().sort((a, b) => a.team - b.team || a.name.localeCompare(b.name));
                sorted.forEach((player) => {
                    const option = document.createElement('option');
                    option.value = player.name;
                    option.textContent = player.name === '<hoozi>' ? 'hoozi' : player.name;
                    option.style.color = teamColor(player.team);
                    fragment.appendChild(option);
                });
                playerSelect.replaceChildren(fragment);
                if (sorted.length === 0) {
                    playerSelect.value = '';
                    return;
                }
                if (!sorted.some((p) => p.name === desiredPlayer)) {
                    desiredPlayer = sorted[0].name;
                }
                playerSelect.value = desiredPlayer;
                localStorage.setItem('sel_player', desiredPlayer);
                updateFocusPlayer();
            };

            const applyPayload = (payload) => {
                if (!payload) return;
                mapMetaInfo(payload);
                const players = Array.isArray(payload.players) ? payload.players : [];
                playerCountEl.textContent = players.length.toString();
                lastUpdateEl.textContent = new Date().toLocaleTimeString();
                if (typeof payload.map !== 'undefined') {
                    const mapSrc = `static/${payload.map}.png`;
                    if (mapImage.dataset.currentSrc !== mapSrc) {
                        mapImage.dataset.currentSrc = mapSrc;
                        mapImage.classList.add('opacity-0');
                        toggleLoading(true);
                        mapImage.src = mapSrc;
                    }
                }
                updatePlayersSelect(players);
                if (mapImage.complete && mapImage.naturalWidth > 0) {
                    resizeCanvas();
                    drawPlayers(players);
                    toggleLoading(false);
                    mapImage.classList.remove('opacity-0');
                }
            };

            mapImage.addEventListener('load', () => {
                resizeCanvas();
                if (latestPayload && Array.isArray(latestPayload.players)) {
                    drawPlayers(latestPayload.players);
                    toggleLoading(false);
                    mapImage.classList.remove('opacity-0');
                }
            });

            const parseMessage = (raw) => {
                try {
                    return JSON.parse(raw);
                } catch (error) {
                    console.warn('无法解析消息', error);
                    return null;
                }
            };

            const computeTarget = () => {
                const input = getElement('conf_ipaddr');
                const raw = (input?.value || '').trim();
                const isAuto = !raw || raw.toLowerCase() === 'auto';
                if (!isAuto && /^wss?:\/\//i.test(raw)) {
                    return raw;
                }
                const scheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                const host = window.location.host;
                if (isAuto) {
                    if (!host) {
                        setStatus('offline', '请填写服务器地址');
                        return null;
                    }
                    return `${scheme}${host}/ws`;
                }
                const sanitized = raw.replace(/^\/+/, '');
                return `${scheme}${sanitized}`;
            };

            const connect = () => {
                clearTimeout(reconnectTimer);
                if (socket) {
                    socket.onopen = null;
                    socket.onmessage = null;
                    socket.onerror = null;
                    socket.onclose = null;
                    try {
                        socket.close();
                    } catch (error) {
                        console.warn('关闭旧连接失败', error);
                    }
                    socket = null;
                }
                const target = computeTarget();
                if (!target) {
                    reconnectTimer = setTimeout(connect, 2000);
                    return;
                }
                setStatus('connecting', '正在连接服务器...');
                toggleLoading(true);
                try {
                    socket = new WebSocket(target);
                } catch (error) {
                    setStatus('offline', '连接失败，重试中...');
                    reconnectTimer = setTimeout(connect, 2000);
                    return;
                }

                socket.onopen = () => {
                    setStatus('online', '已连接服务器');
                };

                socket.onmessage = (event) => {
                    const payload = parseMessage(event.data);
                    if (!payload || Object.keys(payload).length === 0) {
                        return;
                    }
                    latestPayload = payload;
                    if (!freezeUpdates) {
                        applyPayload(payload);
                    }
                };

                socket.onerror = () => {
                    setStatus('offline', '连接异常，正在重试');
                };

                socket.onclose = () => {
                    setStatus('offline', '连接已断开，正在重试');
                    toggleLoading(true);
                    reconnectTimer = setTimeout(connect, 1500);
                };
            };

            resetViewButton.addEventListener('click', () => {
                resetView();
            });

            mapShell.addEventListener('mousedown', (event) => {
                if (event.button !== 0) return;
                viewState.isDragging = true;
                mapShell.classList.add('is-dragging');
                viewState.startX = event.clientX - viewState.translateX;
                viewState.startY = event.clientY - viewState.translateY;
            });

            window.addEventListener('mousemove', (event) => {
                if (!viewState.isDragging) return;
                viewState.translateX = event.clientX - viewState.startX;
                viewState.translateY = event.clientY - viewState.startY;
                applyTransform();
            });

            window.addEventListener('mouseup', () => {
                if (!viewState.isDragging) return;
                viewState.isDragging = false;
                mapShell.classList.remove('is-dragging');
            });

            mapShell.addEventListener('mouseleave', () => {
                if (!viewState.isDragging) return;
                viewState.isDragging = false;
                mapShell.classList.remove('is-dragging');
            });

            const getDistance = (touches) => {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            };

            mapShell.addEventListener('touchstart', (event) => {
                if (event.touches.length === 1) {
                    const touch = event.touches[0];
                    viewState.touchPanId = touch.identifier;
                    viewState.isDragging = true;
                    mapShell.classList.add('is-dragging');
                    viewState.startX = touch.clientX - viewState.translateX;
                    viewState.startY = touch.clientY - viewState.translateY;
                } else if (event.touches.length === 2) {
                    viewState.isDragging = false;
                    viewState.touchPanId = null;
                    viewState.lastTouchDistance = getDistance(event.touches);
                }
            }, { passive: false });

            mapShell.addEventListener('touchmove', (event) => {
                if (event.touches.length === 1 && viewState.touchPanId !== null) {
                    event.preventDefault();
                    const touch = event.touches[0];
                    viewState.translateX = touch.clientX - viewState.startX;
                    viewState.translateY = touch.clientY - viewState.startY;
                    applyTransform();
                } else if (event.touches.length === 2) {
                    event.preventDefault();
                    const newDistance = getDistance(event.touches);
                    if (viewState.lastTouchDistance) {
                        const rect = mapShell.getBoundingClientRect();
                        const centerX = ((event.touches[0].clientX + event.touches[1].clientX) / 2) - rect.left;
                        const centerY = ((event.touches[0].clientY + event.touches[1].clientY) / 2) - rect.top;
                        const ratio = newDistance / viewState.lastTouchDistance;
                        zoomAt(centerX, centerY, viewState.scale * ratio);
                    }
                    viewState.lastTouchDistance = newDistance;
                }
            }, { passive: false });

            mapShell.addEventListener('touchend', (event) => {
                if (event.touches.length === 0) {
                    viewState.touchPanId = null;
                    viewState.isDragging = false;
                    mapShell.classList.remove('is-dragging');
                }
                if (event.touches.length < 2) {
                    viewState.lastTouchDistance = null;
                }
            });

            mapShell.addEventListener('wheel', (event) => {
                event.preventDefault();
                const rect = mapShell.getBoundingClientRect();
                const offsetX = event.clientX - rect.left;
                const offsetY = event.clientY - rect.top;
                const direction = event.deltaY < 0 ? 1 : -1;
                const nextScale = viewState.scale * (1 + direction * 0.1);
                zoomAt(offsetX, offsetY, nextScale);
            }, { passive: false });

            settingDefinitions.forEach((setting) => {
                const element = getElement(setting.id);
                if (!element) return;
                const stored = localStorage.getItem(setting.id);
                if (setting.type === 'checkbox') {
                    const defaultValue = setting.defaultValue;
                    element.checked = stored === null ? defaultValue : stored === 'true';
                    element.addEventListener('change', () => {
                        localStorage.setItem(setting.id, String(element.checked));
                        updateFilterSummary();
                        if (latestPayload && !freezeUpdates) {
                            drawPlayers(latestPayload.players || []);
                        }
                    });
                } else {
                    element.value = stored !== null ? stored : setting.defaultValue;
                    element.addEventListener('change', () => {
                        localStorage.setItem(setting.id, element.value.trim());
                        if (setting.id === 'conf_fontsize' && latestPayload && !freezeUpdates) {
                            drawPlayers(latestPayload.players || []);
                        }
                        if (setting.id === 'conf_ipaddr') {
                            connect();
                        }
                        if (setting.id === 'conf_glevel' || setting.id === 'conf_gkill') {
                            updateFilterSummary();
                            if (latestPayload && !freezeUpdates) {
                                drawPlayers(latestPayload.players || []);
                            }
                        }
                    });
                }
            });

            updateFilterSummary();

            playerSelect.value = desiredPlayer;

            playerSelect.addEventListener('focus', () => {
                freezeUpdates = true;
            });

            playerSelect.addEventListener('blur', () => {
                freezeUpdates = false;
                if (latestPayload) {
                    applyPayload(latestPayload);
                }
            });

            playerSelect.addEventListener('change', () => {
                desiredPlayer = playerSelect.value;
                localStorage.setItem('sel_player', desiredPlayer);
                updateFocusPlayer();
                if (latestPayload) {
                    drawPlayers(latestPayload.players || []);
                }
            });

            const toggleSettings = (show) => {
                if (!settingsPanel) return;
                if (show) {
                    settingsPanel.classList.remove('hidden');
                    settingsPanel.classList.add('flex');
                    freezeUpdates = true;
                } else {
                    settingsPanel.classList.add('hidden');
                    settingsPanel.classList.remove('flex');
                    freezeUpdates = false;
                    if (latestPayload) {
                        applyPayload(latestPayload);
                    }
                }
            };

            openSettingsBtn.addEventListener('click', () => toggleSettings(true));
            closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
            settingsPanel.addEventListener('click', (event) => {
                if (event.target && event.target.hasAttribute('data-close-settings')) {
                    toggleSettings(false);
                }
            });

            connect();
        });
    </script>
</body>

</html>
