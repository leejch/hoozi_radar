<!doctype html>
<html lang="zh-CN" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOZI RADAR · 情报指挥中心</title>
    <meta name="theme-color" content="#020617">
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Segoe UI"', '"Microsoft YaHei"', '"Noto Sans SC"', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            color-scheme: dark;
            --map-max-size: min(48rem, calc(100vh - 12rem));
        }

        @media (max-width: 1023px) {
            :root {
                --map-max-size: min(100vw - 2.5rem, calc(100vh - 10rem));
            }
        }

        body {
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
            background:
                radial-gradient(ellipse at top, rgba(16, 185, 129, 0.08), transparent 55%),
                radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.05), transparent 60%),
                #020617;
        }

        .glass-panel {
            background-color: rgba(15, 23, 42, 0.64);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(18px);
        }

        #mapStage {
            touch-action: none;
            cursor: grab;
            max-width: 100%;
            max-height: 100%;
        }

        #mapStage.dragging {
            cursor: grabbing;
        }

        #mapViewport {
            position: absolute;
            inset: 0;
            transform-origin: top left;
        }

        #mapViewport img,
        #mapViewport canvas {
            position: absolute;
            inset: 0;
        }

        #mapViewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        #mapViewport canvas {
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #mapOverlay {
            transition: opacity 220ms ease, visibility 220ms ease;
            pointer-events: none;
        }

        #mapOverlay[data-state="hidden"] {
            opacity: 0;
            visibility: hidden;
        }

        #mapOverlay[data-state="loading"] [data-role="spinner"] {
            display: block;
        }

        #mapOverlay[data-state="info"] [data-role="spinner"] {
            display: none;
        }

        @media (min-width: 1024px) {
            .map-shell {
                min-height: var(--map-max-size);
            }

            #mapStage {
                width: var(--map-max-size);
                height: var(--map-max-size);
                aspect-ratio: auto;
            }

            .config-stack {
                max-height: var(--map-max-size);
                overflow-y: auto;
                padding-right: 0.25rem;
                scrollbar-width: thin;
            }
        }

        @media (max-width: 640px) {
            header .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            main .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            body {
                background-position: center;
            }
        }
    </style>
</head>

<body class="min-h-screen text-slate-100 flex flex-col">
    <header class="w-full border-b border-slate-800/60 bg-slate-950/60 backdrop-blur-xl">
        <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-6 sm:px-6 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex items-center gap-4">
                <div class="flex size-12 items-center justify-center rounded-2xl bg-slate-900/80 ring-1 ring-emerald-500/40">
                    <img src="static/default.png" alt="HOOZI Radar" class="h-8 w-8 object-contain" draggable="false">
                </div>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">HOOZI 雷达指挥中心</h1>
                    <p class="text-sm text-slate-400">实时洞察战局，规划攻守策略</p>
                </div>
            </div>
            <div class="flex w-full flex-col gap-4 sm:flex-row sm:items-center sm:justify-end lg:w-auto">
                <div class="flex w-full items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900/50 px-4 py-2 sm:w-auto">
                    <span data-role="status-indicator" class="size-3 rounded-full bg-slate-500 shadow-inner shadow-black/50 transition"></span>
                    <div class="text-xs uppercase tracking-[0.25em] text-slate-400">状态</div>
                    <span data-role="status-text" class="text-sm font-medium text-slate-200">等待连接</span>
                </div>
                <div class="w-full sm:w-auto">
                    <label for="sel_player" class="text-xs uppercase tracking-[0.25em] text-slate-400">关注玩家</label>
                    <select id="sel_player" autocomplete="off"
                        class="mt-2 min-w-[180px] rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm font-medium text-slate-100 outline-none focus:border-emerald-400/70 focus:ring-2 focus:ring-emerald-500/40">
                        <option value="<hoozi>">hoozi</option>
                    </select>
                </div>
            </div>
        </div>
    </header>
    <main class="w-full flex-1">
        <div class="mx-auto flex w-full max-w-7xl flex-col-reverse gap-6 px-4 pb-10 sm:px-6 sm:pb-12 lg:flex-row lg:items-stretch">
            <aside class="w-full lg:w-80 lg:flex-shrink-0">
                <div class="config-stack space-y-6">
                    <section class="glass-panel rounded-3xl p-6 shadow-xl shadow-emerald-500/10">
                        <div class="flex items-center justify-between gap-4">
                            <h2 class="text-sm font-semibold uppercase tracking-[0.3em] text-slate-300">连接配置</h2>
                            <button id="reconnectButton" type="button"
                                class="rounded-full border border-emerald-500/70 bg-emerald-500/10 px-4 py-1.5 text-xs font-semibold text-emerald-300 transition hover:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                                重连
                            </button>
                        </div>
                        <div class="mt-5 space-y-5">
                            <div>
                                <label for="conf_ipaddr" class="text-xs uppercase tracking-[0.3em] text-slate-500">服务器地址</label>
                                <input id="conf_ipaddr" type="text" placeholder="auto"
                                    class="mt-2 w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                                <p class="mt-2 text-xs text-slate-500">留空或填写 auto 将自动使用当前域名的 <span class="font-mono">/ws</span>。</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="conf_fontsize" class="text-xs uppercase tracking-[0.3em] text-slate-500">字体大小</label>
                                    <input id="conf_fontsize" type="number" min="6" max="48" step="1"
                                        class="mt-2 w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                                </div>
                                <div>
                                    <label for="conf_gkill" class="text-xs uppercase tracking-[0.3em] text-slate-500">击杀高于</label>
                                    <input id="conf_gkill" type="number" min="0" step="1"
                                        class="mt-2 w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                                </div>
                                <div class="col-span-2">
                                    <label for="conf_glevel" class="text-xs uppercase tracking-[0.3em] text-slate-500">等级低于</label>
                                    <input id="conf_glevel" type="number" min="0" step="1"
                                        class="mt-2 w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="glass-panel rounded-3xl p-6 shadow-xl shadow-sky-500/10">
                        <h2 class="text-sm font-semibold uppercase tracking-[0.3em] text-slate-300">显示过滤</h2>
                        <p class="mt-2 text-xs text-slate-500">全部取消时将显示所有玩家。</p>
                        <div class="mt-4 space-y-3">
                            <label class="group flex items-start gap-3 rounded-2xl border border-slate-800/80 bg-slate-950/40 px-4 py-3 transition hover:border-emerald-400/60">
                                <input id="conf_showmp" type="checkbox"
                                    class="mt-1 size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">名册玩家位置</p>
                                    <p class="text-xs text-slate-500">仅标注白名单 / 黑名单 / 权限玩家。</p>
                                </div>
                            </label>
                            <label class="group flex items-start gap-3 rounded-2xl border border-slate-800/80 bg-slate-950/40 px-4 py-3 transition hover:border-emerald-400/60">
                                <input id="conf_showsp" type="checkbox"
                                    class="mt-1 size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">嫌疑玩家位置</p>
                                    <p class="text-xs text-slate-500">低等级或高击杀的异常玩家。</p>
                                </div>
                            </label>
                            <label class="group flex items-start gap-3 rounded-2xl border border-slate-800/80 bg-slate-950/40 px-4 py-3 transition hover:border-emerald-400/60">
                                <input id="conf_showtp" type="checkbox"
                                    class="mt-1 size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">队伍玩家位置</p>
                                    <p class="text-xs text-slate-500">突出当前关注玩家所属队伍。</p>
                                </div>
                            </label>
                        </div>
                    </section>
                    <section class="glass-panel rounded-3xl p-6 shadow-xl shadow-fuchsia-500/10">
                        <h2 class="text-sm font-semibold uppercase tracking-[0.3em] text-slate-300">信息呈现</h2>
                        <p class="mt-2 text-xs text-slate-500">自定义玩家标签所包含的内容。</p>
                        <div class="mt-4 space-y-3">
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">昵称信息</p>
                                    <p class="text-xs text-slate-500">显示玩家的昵称文本。</p>
                                </div>
                                <input id="conf_showname" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">击杀信息</p>
                                    <p class="text-xs text-slate-500">在昵称前附加 [K:x] 标识。</p>
                                </div>
                                <input id="conf_showkprefix" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">等级信息</p>
                                    <p class="text-xs text-slate-500">在昵称前附加 [Lv:x] 标识。</p>
                                </div>
                                <input id="conf_showlprefix" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">段位信息</p>
                                    <p class="text-xs text-slate-500">显示玩家段位名称。</p>
                                </div>
                                <input id="conf_showrankprefix" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">名册标识</p>
                                    <p class="text-xs text-slate-500">显示 [黑] / [白] / [权] 标签。</p>
                                </div>
                                <input id="conf_showmprefix" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-4 py-3">
                                <div>
                                    <p class="text-sm font-medium text-slate-100">嫌疑标识</p>
                                    <p class="text-xs text-slate-500">显示 [低级] / [高杀] / [嫌] 标签。</p>
                                </div>
                                <input id="conf_showsprefix" type="checkbox" checked
                                    class="size-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            </label>
                        </div>
                    </section>
                </div>
            </aside>
            <section class="map-shell flex-1 flex flex-col lg:items-end">
                <div id="mapStage"
                    class="glass-panel relative aspect-square w-full overflow-hidden rounded-[2rem] border border-slate-800/80 shadow-[0_40px_120px_-60px_rgba(34,197,94,0.35)]">
                    <div id="mapViewport" class="absolute inset-0">
                        <img id="mapImage" src="" alt="地图背景" draggable="false">
                        <canvas id="mapCanvas"></canvas>
                    </div>
                    <div id="mapOverlay" data-state="loading"
                        class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-slate-950/70 text-slate-200"
                        role="status" aria-live="polite">
                        <div data-role="spinner"
                            class="h-12 w-12 rounded-full border-4 border-slate-700 border-t-emerald-400 animate-spin"></div>
                        <div class="space-y-1 px-6 text-center">
                            <p id="overlayTitle" class="text-lg font-semibold">等待连接...</p>
                            <p id="overlaySubtitle" class="text-sm text-slate-400">正在尝试与服务器建立通信</p>
                        </div>
                    </div>
                    <div
                        class="absolute top-5 left-5 flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-500/10 px-4 py-2 text-xs font-semibold text-emerald-200">
                        <span class="size-2 rounded-full bg-emerald-400"></span>
                        <span id="mapName">地图 -</span>
                    </div>
                    <div
                        class="absolute top-5 right-5 flex items-center gap-2 rounded-full border border-slate-700 bg-slate-950/70 px-3 py-1.5 text-xs text-slate-300">
                        <span class="tracking-[0.3em] text-slate-500">玩家</span>
                        <span id="playerCount" class="text-sm font-semibold text-white">0</span>
                    </div>
                    <div
                        class="absolute bottom-5 left-5 flex flex-wrap items-center gap-3 rounded-full border border-slate-700 bg-slate-950/70 px-4 py-2 text-xs text-slate-200">
                        <div class="flex flex-wrap items-center gap-2 text-sm font-semibold text-white">
                            <span class="text-[0.65rem] uppercase tracking-[0.35em] text-slate-500">焦点</span>
                            <span id="focusTeamBadge" class="size-2.5 rounded-full bg-slate-500"></span>
                            <span id="focusPlayerName" class="max-w-[150px] truncate text-sm font-semibold text-white sm:max-w-[220px]">—</span>
                            <span id="focusMeta"
                                class="rounded-full border border-slate-700/70 bg-slate-900/70 px-2 py-0.5 text-[0.7rem] font-medium text-slate-200">Lv — · K —</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm">
                            <span class="text-slate-500">X</span>
                            <span id="playerPosX" class="font-mono text-sm text-white">—</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm">
                            <span class="text-slate-500">Y</span>
                            <span id="playerPosY" class="font-mono text-sm text-white">—</span>
                        </div>
                    </div>
                    <div class="absolute bottom-5 right-5 flex items-center gap-2">
                        <button id="zoomOut" type="button"
                            class="rounded-full border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                            -
                        </button>
                        <button id="zoomReset" type="button"
                            class="rounded-full border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                            重置
                        </button>
                        <button id="zoomIn" type="button"
                            class="rounded-full border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                            +
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script type="module">
        const doc = document;
        const refs = {
            statusIndicator: doc.querySelector('[data-role="status-indicator"]'),
            statusText: doc.querySelector('[data-role="status-text"]'),
            playerSelect: doc.getElementById('sel_player'),
            mapStage: doc.getElementById('mapStage'),
            mapViewport: doc.getElementById('mapViewport'),
            mapImage: doc.getElementById('mapImage'),
            mapCanvas: doc.getElementById('mapCanvas'),
            mapOverlay: doc.getElementById('mapOverlay'),
            overlayTitle: doc.getElementById('overlayTitle'),
            overlaySubtitle: doc.getElementById('overlaySubtitle'),
            mapName: doc.getElementById('mapName'),
            playerCount: doc.getElementById('playerCount'),
            playerPosX: doc.getElementById('playerPosX'),
            playerPosY: doc.getElementById('playerPosY'),
            focusName: doc.getElementById('focusPlayerName'),
            focusTeamBadge: doc.getElementById('focusTeamBadge'),
            focusMeta: doc.getElementById('focusMeta'),
            zoomIn: doc.getElementById('zoomIn'),
            zoomOut: doc.getElementById('zoomOut'),
            zoomReset: doc.getElementById('zoomReset'),
            reconnectButton: doc.getElementById('reconnectButton'),
            inputs: {
                ip: doc.getElementById('conf_ipaddr'),
                font: doc.getElementById('conf_fontsize'),
                gkill: doc.getElementById('conf_gkill'),
                glevel: doc.getElementById('conf_glevel'),
                showmp: doc.getElementById('conf_showmp'),
                showsp: doc.getElementById('conf_showsp'),
                showtp: doc.getElementById('conf_showtp'),
                showname: doc.getElementById('conf_showname'),
                showkprefix: doc.getElementById('conf_showkprefix'),
                showlprefix: doc.getElementById('conf_showlprefix'),
                showrankprefix: doc.getElementById('conf_showrankprefix'),
                showmprefix: doc.getElementById('conf_showmprefix'),
                showsprefix: doc.getElementById('conf_showsprefix')
            }
        };

        const state = {
            socket: null,
            reconnectTimer: null,
            players: [],
            mapId: null,
            mapLoaded: false,
            mapPixelWidth: 1080,
            mapPixelHeight: 1080,
            renderScaleX: 1,
            renderScaleY: 1,
            isSelectingPlayer: false,
            viewport: { scale: 1, translateX: 0, translateY: 0 },
            isConnected: false
        };

        const teamPalette = [
            '#F87171', '#34D399', '#60A5FA', '#FBBF24', '#2DD4BF', '#A855F7', '#F97316', '#38BDF8', '#22C55E', '#F472B6',
            '#A3A3A3', '#FDE68A', '#F9A8D4', '#C4B5FD', '#A7F3D0', '#7DD3FC', '#FDBA74', '#86EFAC', '#FCA5A5', '#FACC15',
            '#67E8F9', '#E9D5FF', '#F0ABFC', '#BBF7D0', '#93C5FD', '#FECACA', '#FCD34D', '#FBCFE8', '#C7D2FE', '#A5F3FC',
            '#FDBA74', '#86EFAC', '#FDE68A', '#F9A8D4', '#C4B5FD', '#D1D5DB', '#F472B6', '#FB7185', '#F97316', '#34D399',
            '#60A5FA'
        ];

        function teamColorFor(teamId) {
            if (teamId === undefined || teamId === null) {
                return '#93C5FD';
            }
            const index = Math.abs(Number(teamId)) % teamPalette.length;
            return teamPalette[index];
        }

        function readSetting(key, fallback) {
            const stored = localStorage.getItem(key);
            if (stored === null) return fallback;
            if (typeof fallback === 'boolean') {
                return stored === 'true';
            }
            if (typeof fallback === 'number') {
                const parsed = Number(stored);
                return Number.isFinite(parsed) ? parsed : fallback;
            }
            return stored;
        }

        const settings = {
            ipaddr: readSetting('conf_ipaddr', 'auto'),
            fontsize: readSetting('conf_fontsize', 10),
            gkill: readSetting('conf_gkill', 5),
            glevel: readSetting('conf_glevel', 250),
            showmp: readSetting('conf_showmp', false),
            showsp: readSetting('conf_showsp', false),
            showtp: readSetting('conf_showtp', false),
            showname: readSetting('conf_showname', true),
            showkprefix: readSetting('conf_showkprefix', true),
            showlprefix: readSetting('conf_showlprefix', true),
            showrankprefix: readSetting('conf_showrankprefix', true),
            showmprefix: readSetting('conf_showmprefix', true),
            showsprefix: readSetting('conf_showsprefix', true),
            selectedPlayer: readSetting('sel_player', '<hoozi>')
        };

        // Initialize input values
        refs.inputs.ip.value = settings.ipaddr;
        refs.inputs.font.value = settings.fontsize;
        refs.inputs.gkill.value = settings.gkill;
        refs.inputs.glevel.value = settings.glevel;
        refs.inputs.showmp.checked = settings.showmp;
        refs.inputs.showsp.checked = settings.showsp;
        refs.inputs.showtp.checked = settings.showtp;
        refs.inputs.showname.checked = settings.showname;
        refs.inputs.showkprefix.checked = settings.showkprefix;
        refs.inputs.showlprefix.checked = settings.showlprefix;
        refs.inputs.showrankprefix.checked = settings.showrankprefix;
        refs.inputs.showmprefix.checked = settings.showmprefix;
        refs.inputs.showsprefix.checked = settings.showsprefix;

        const mapCtx = refs.mapCanvas.getContext('2d');

        function setOverlayState(stateName, title, subtitle) {
            if (!refs.mapOverlay) return;
            refs.mapOverlay.dataset.state = stateName;
            if (title !== undefined) refs.overlayTitle.textContent = title;
            if (subtitle !== undefined) refs.overlaySubtitle.textContent = subtitle;
        }

        function updateStatus(stateName, label) {
            if (label) {
                refs.statusText.textContent = label;
            }
            const indicator = refs.statusIndicator;
            indicator.classList.remove('bg-emerald-400', 'bg-amber-300', 'bg-rose-500', 'bg-slate-500', 'animate-pulse');
            indicator.style.boxShadow = 'none';
            switch (stateName) {
                case 'connected':
                    indicator.classList.add('bg-emerald-400');
                    indicator.style.boxShadow = '0 0 0 6px rgba(16, 185, 129, 0.2)';
                    break;
                case 'connecting':
                    indicator.classList.add('bg-amber-300', 'animate-pulse');
                    indicator.style.boxShadow = '0 0 0 6px rgba(251, 191, 36, 0.18)';
                    break;
                case 'error':
                    indicator.classList.add('bg-rose-500');
                    indicator.style.boxShadow = '0 0 0 6px rgba(244, 63, 94, 0.18)';
                    break;
                default:
                    indicator.classList.add('bg-slate-500');
                    break;
            }
        }

        function buildTarget() {
            const raw = (settings.ipaddr || '').trim();
            if (!raw || raw.toLowerCase() === 'auto') {
                if (!location.host) {
                    return null;
                }
                const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
                return `${scheme}${location.host}/ws`;
            }
            if (/^wss?:\/\//i.test(raw)) {
                return raw;
            }
            const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
            const sanitized = raw.replace(/^\/+/, '');
            return `${scheme}${sanitized}`;
        }

        function clearSocket() {
            if (state.socket) {
                try {
                    state.socket.onclose = null;
                    state.socket.onerror = null;
                    state.socket.onmessage = null;
                    state.socket.close();
                } catch (error) {
                    console.error('关闭连接时发生错误', error);
                }
            }
            state.socket = null;
        }

        function connect(manual = false) {
            clearTimeout(state.reconnectTimer);
            clearSocket();

            const target = buildTarget();
            if (!target) {
                updateStatus('error', '等待地址');
                setOverlayState('info', '无法确定服务器地址', '请在右侧填写有效的 ws/wss 地址');
                state.reconnectTimer = setTimeout(() => connect(), 2500);
                return;
            }

            updateStatus('connecting', '连接中...');
            setOverlayState('loading', '等待连接...', `正在连接到 ${target}`);

            let socket;
            try {
                socket = new WebSocket(target);
            } catch (error) {
                console.error('无法创建 WebSocket', error);
                updateStatus('error', '连接失败');
                setOverlayState('info', '连接失败', '将在稍后自动重试');
                state.reconnectTimer = setTimeout(() => connect(), 2000);
                return;
            }

            state.socket = socket;

            socket.onopen = () => {
                state.isConnected = true;
                updateStatus('connected', '已连接');
                setOverlayState('loading', '等待地图数据', '请进入游戏或等待房间同步');
            };

            socket.onmessage = (event) => {
                handleMessage(event.data);
            };

            socket.onerror = () => {
                socket.close();
            };

            socket.onclose = () => {
                if (state.socket !== socket) {
                    return;
                }
                state.isConnected = false;
                updateStatus('error', '连接断开');
                setOverlayState('info', '已断开连接', '将在 1.5 秒后尝试重新连接');
                state.mapLoaded = false;
                state.players = [];
                state.mapId = null;
                refs.mapImage.removeAttribute('src');
                refs.playerCount.textContent = '0';
                updatePlayerInfo();
                renderPlayers();
                state.reconnectTimer = setTimeout(() => connect(), manual ? 2000 : 1500);
            };
        }

        function resizeCanvas() {
            const rect = refs.mapStage.getBoundingClientRect();
            const ratio = window.devicePixelRatio || 1;
            const width = Math.max(1, Math.round(rect.width * ratio));
            const height = Math.max(1, Math.round(rect.height * ratio));
            refs.mapCanvas.width = width;
            refs.mapCanvas.height = height;
            refs.mapCanvas.style.width = `${rect.width}px`;
            refs.mapCanvas.style.height = `${rect.height}px`;
            state.renderScaleX = width / (state.mapPixelWidth || 1080);
            state.renderScaleY = height / (state.mapPixelHeight || 1080);
        }

        function applyTransform() {
            const { scale, translateX, translateY } = state.viewport;
            refs.mapViewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function resetViewport() {
            state.viewport.scale = 1;
            state.viewport.translateX = 0;
            state.viewport.translateY = 0;
            applyTransform();
        }

        function zoomAt(point, factor) {
            const minScale = 0.4;
            const maxScale = 5;
            const previous = state.viewport.scale;
            let next = previous * factor;
            next = Math.min(maxScale, Math.max(minScale, next));
            const scaleRatio = next / previous;
            state.viewport.translateX = point.x - (point.x - state.viewport.translateX) * scaleRatio;
            state.viewport.translateY = point.y - (point.y - state.viewport.translateY) * scaleRatio;
            state.viewport.scale = next;
            applyTransform();
        }

        function populatePlayerSelect(players) {
            if (state.isSelectingPlayer) {
                return;
            }
            const select = refs.playerSelect;
            const sorted = [...players].sort((a, b) => (a.team ?? 0) - (b.team ?? 0));
            const fragment = doc.createDocumentFragment();
            sorted.forEach(player => {
                const option = doc.createElement('option');
                option.value = player.name;
                option.textContent = player.name === '<hoozi>' ? 'hoozi' : player.name;
                option.style.color = teamColorFor(player.team);
                fragment.appendChild(option);
            });
            select.innerHTML = '';
            select.appendChild(fragment);
            if (!players.some(player => player.name === settings.selectedPlayer)) {
                const fallback = players.find(player => player.name === '<hoozi>') ?? players[0];
                if (fallback) {
                    settings.selectedPlayer = fallback.name;
                    localStorage.setItem('sel_player', settings.selectedPlayer);
                }
            }
            if (settings.selectedPlayer) {
                select.value = settings.selectedPlayer;
            }
        }

        function formatCoordinate(value) {
            if (typeof value !== 'number' || !Number.isFinite(value)) {
                return '—';
            }
            return value.toFixed(1);
        }

        function updatePlayerInfo() {
            const players = state.players;
            if (!players.length) {
                refs.focusName.textContent = '—';
                refs.focusName.style.color = '#e2e8f0';
                refs.focusName.title = '';
                refs.focusTeamBadge.style.backgroundColor = 'rgba(148, 163, 184, 0.6)';
                refs.focusMeta.textContent = 'Lv — · K —';
                refs.focusMeta.style.backgroundColor = 'rgba(15, 23, 42, 0.7)';
                refs.focusMeta.style.borderColor = 'rgba(148, 163, 184, 0.3)';
                refs.playerPosX.textContent = '—';
                refs.playerPosY.textContent = '—';
                return;
            }

            let focus = players.find(player => player.name === settings.selectedPlayer);
            if (!focus) {
                focus = players[0];
                settings.selectedPlayer = focus.name;
                localStorage.setItem('sel_player', settings.selectedPlayer);
                if (!state.isSelectingPlayer) {
                    refs.playerSelect.value = focus.name;
                }
            }

            const teamColor = teamColorFor(focus.team);
            refs.focusName.textContent = focus.name === '<hoozi>' ? 'hoozi' : focus.name;
            refs.focusName.style.color = teamColor;
            const teamLabel = focus.team !== undefined && focus.team !== null ? `Team ${focus.team}` : 'Team —';
            refs.focusName.title = focus.rank ? `${teamLabel} · ${focus.rank}` : teamLabel;
            refs.focusTeamBadge.style.backgroundColor = teamColor;
            const level = typeof focus.level === 'number' ? focus.level : '—';
            const kills = typeof focus.kills === 'number' ? focus.kills : '—';
            refs.focusMeta.textContent = `Lv ${level} · K ${kills}`;
            if (focus.hostile === true) {
                refs.focusMeta.style.backgroundColor = 'rgba(244, 63, 94, 0.18)';
                refs.focusMeta.style.borderColor = 'rgba(244, 63, 94, 0.45)';
            } else if (focus.hostile === false) {
                refs.focusMeta.style.backgroundColor = 'rgba(34, 197, 94, 0.16)';
                refs.focusMeta.style.borderColor = 'rgba(34, 197, 94, 0.45)';
            } else {
                refs.focusMeta.style.backgroundColor = 'rgba(15, 23, 42, 0.7)';
                refs.focusMeta.style.borderColor = 'rgba(148, 163, 184, 0.35)';
            }
            refs.playerPosX.textContent = formatCoordinate(focus.pos?.x);
            refs.playerPosY.textContent = formatCoordinate(focus.pos?.y);
        }

        function renderPlayers() {
            mapCtx.setTransform(1, 0, 0, 1, 0, 0);
            mapCtx.clearRect(0, 0, refs.mapCanvas.width, refs.mapCanvas.height);

            if (!state.mapLoaded || !state.players.length) {
                return;
            }

            const players = state.players;
            let localPlayer = players.find(player => player.name === settings.selectedPlayer);
            if (!localPlayer) {
                localPlayer = players[0];
            }
            if (!localPlayer) return;

            const buffer = doc.createElement('canvas');
            buffer.width = refs.mapCanvas.width;
            buffer.height = refs.mapCanvas.height;
            const bctx = buffer.getContext('2d');
            const scaleX = state.renderScaleX || 1;
            const scaleY = state.renderScaleY || scaleX;
            bctx.scale(scaleX, scaleY);
            bctx.imageSmoothingEnabled = true;
            const fontSize = Number(settings.fontsize) || 10;
            bctx.font = `${fontSize}px "Microsoft YaHei", "Noto Sans SC", "Inter", sans-serif`;
            bctx.textAlign = 'center';
            bctx.textBaseline = 'bottom';

            const textCache = [];
            const showAll = !settings.showmp && !settings.showsp && !settings.showtp;
            const selectedTeam = localPlayer.team;
            const localX = localPlayer.pos?.x ?? 0;
            const localY = localPlayer.pos?.y ?? 0;

            players.forEach(player => {
                const px = player.pos?.x ?? 0;
                const py = player.pos?.y ?? 0;
                const color = player.team === selectedTeam ? '#FFFFFF' : teamColorFor(player.team);

                bctx.beginPath();
                bctx.arc(px, py, 4.8, 0, Math.PI * 2);
                bctx.fillStyle = color;
                bctx.fill();
                bctx.lineWidth = 1.2;
                bctx.strokeStyle = 'rgba(2, 6, 23, 0.9)';
                bctx.stroke();
                bctx.closePath();

                if (player.team === selectedTeam && player.name !== localPlayer.name) {
                    bctx.save();
                    bctx.beginPath();
                    bctx.moveTo(localX, localY);
                    bctx.lineTo(px, py);
                    bctx.strokeStyle = `${color}80`;
                    bctx.lineWidth = 1.2;
                    bctx.stroke();
                    bctx.restore();
                }

                if (player.name === localPlayer.name) {
                    return;
                }

                if (!showAll) {
                    let visible = false;
                    if (settings.showtp && player.team === selectedTeam) visible = true;
                    const isRoster = Boolean(player.pro || player.white || player.black);
                    if (settings.showmp && isRoster) visible = true;
                    const levelLow = typeof player.level === 'number' && player.level < settings.glevel;
                    const killHigh = typeof player.kills === 'number' && player.kills > settings.gkill;
                    if (settings.showsp && (levelLow || killHigh)) visible = true;
                    if (!visible) return;
                }

                const isRoster = Boolean(player.pro || player.white || player.black);
                const levelLow = typeof player.level === 'number' && player.level < settings.glevel;
                const killHigh = typeof player.kills === 'number' && player.kills > settings.gkill;

                const labelParts = [];
                if (player.team !== selectedTeam) {
                    if (settings.showmprefix && isRoster) {
                        labelParts.push(`[${player.pro ? '权' : player.white ? '白' : player.black ? '黑' : ''}]`);
                    }
                    if (settings.showsprefix && (levelLow || killHigh)) {
                        if (levelLow && killHigh) {
                            labelParts.push('[嫌]');
                        } else {
                            if (levelLow) labelParts.push('[低级]');
                            if (killHigh) labelParts.push('[高杀]');
                        }
                    }
                    if (settings.showkprefix && typeof player.kills === 'number') {
                        labelParts.push(`[K:${player.kills}]`);
                    }
                    if (settings.showlprefix && typeof player.level === 'number') {
                        labelParts.push(`[Lv:${player.level}]`);
                    }
                    if (settings.showrankprefix && player.rank) {
                        labelParts.push(`[${player.rank}]`);
                    }
                }
                if (settings.showname) {
                    labelParts.push(player.name);
                }
                if (!labelParts.length) return;

                let label = labelParts.join(' ');
                if (label.length > 48) {
                    label = `${label.slice(0, 48)}…`;
                }

                const textHeight = fontSize * 1.2;
                let adjustedY = py - 10;
                textCache.forEach(cached => {
                    if (cached.team === player.team) {
                        const dx = Math.abs(cached.cx - px);
                        const dy = Math.abs(cached.cy - adjustedY);
                        if (dx < cached.width / 2 && dy < cached.height) {
                            adjustedY -= cached.height;
                        }
                    }
                });

                bctx.lineWidth = 3;
                bctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
                bctx.strokeText(label, px, adjustedY);
                bctx.fillStyle = color;
                bctx.fillText(label, px, adjustedY);

                const textWidth = bctx.measureText(label).width;
                textCache.push({ cx: px, cy: adjustedY, width: textWidth, height: textHeight, team: player.team });
            });

            bctx.beginPath();
            bctx.lineWidth = 1.5;
            bctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            bctx.moveTo(0, localY);
            bctx.lineTo(state.mapPixelWidth, localY);
            bctx.moveTo(localX, 0);
            bctx.lineTo(localX, state.mapPixelHeight);
            bctx.stroke();
            bctx.closePath();

            bctx.beginPath();
            bctx.arc(localX, localY, 6, 0, Math.PI * 2);
            bctx.lineWidth = 2.2;
            bctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            bctx.stroke();
            bctx.closePath();

            mapCtx.drawImage(buffer, 0, 0);
        }

        function updateMapBadge() {
            if (state.mapId) {
                refs.mapName.textContent = `地图 ${state.mapId}`;
            } else {
                refs.mapName.textContent = '地图 -';
            }
        }

        function handleMessage(raw) {
            if (!raw) return;
            let payload;
            try {
                payload = JSON.parse(raw);
            } catch (error) {
                console.error('无法解析服务器数据', raw);
                return;
            }

            if (payload.map) {
                updateMap(payload.map);
            }
            if (Array.isArray(payload.players)) {
                updatePlayers(payload.players);
            }
        }

        function updateMap(mapId) {
            if (!mapId) return;
            if (state.mapId === mapId && state.mapLoaded) {
                return;
            }
            state.mapId = mapId;
            state.mapLoaded = false;
            updateMapBadge();
            setOverlayState('loading', '加载地图', '正在载入地图资源...');
            const src = `static/${mapId}.png`;
            if (refs.mapImage.getAttribute('src') === src && refs.mapImage.complete) {
                onMapReady();
            } else {
                refs.mapImage.src = src;
            }
        }

        function updatePlayers(players) {
            state.players = players;
            refs.playerCount.textContent = players.length.toString();
            if (players.length) {
                populatePlayerSelect(players);
                if (state.mapLoaded) {
                    setOverlayState('hidden');
                }
            } else if (state.mapLoaded) {
                setOverlayState('info', '等待玩家数据', '当前地图暂无玩家或数据尚未同步');
            }
            updatePlayerInfo();
            renderPlayers();
        }

        function onMapReady() {
            if (!refs.mapImage.naturalWidth || !refs.mapImage.naturalHeight) {
                return;
            }
            state.mapPixelWidth = refs.mapImage.naturalWidth;
            state.mapPixelHeight = refs.mapImage.naturalHeight;
            resizeCanvas();
            resetViewport();
            state.mapLoaded = true;
            if (state.players.length) {
                setOverlayState('hidden');
            } else {
                setOverlayState('info', '等待玩家数据', '当前地图暂无玩家或数据尚未同步');
            }
            renderPlayers();
        }

        refs.mapImage.addEventListener('load', onMapReady);
        refs.mapImage.addEventListener('error', () => {
            setOverlayState('info', '地图资源缺失', `未找到 static/${state.mapId}.png`);
        });

        refs.playerSelect.addEventListener('focus', () => {
            state.isSelectingPlayer = true;
        });
        refs.playerSelect.addEventListener('blur', () => {
            state.isSelectingPlayer = false;
        });
        refs.playerSelect.addEventListener('change', (event) => {
            settings.selectedPlayer = event.target.value;
            localStorage.setItem('sel_player', settings.selectedPlayer);
            updatePlayerInfo();
            renderPlayers();
        });

        refs.inputs.ip.addEventListener('change', (event) => {
            const value = (event.target.value || '').trim() || 'auto';
            settings.ipaddr = value;
            event.target.value = value;
            localStorage.setItem('conf_ipaddr', value);
        });

        refs.inputs.font.addEventListener('input', (event) => {
            let value = Number(event.target.value);
            if (!Number.isFinite(value)) value = settings.fontsize;
            value = Math.max(6, Math.min(48, value));
            settings.fontsize = value;
            localStorage.setItem('conf_fontsize', value);
            renderPlayers();
        });

        refs.inputs.gkill.addEventListener('input', (event) => {
            let value = Number(event.target.value);
            if (!Number.isFinite(value) || value < 0) value = 0;
            settings.gkill = value;
            localStorage.setItem('conf_gkill', value);
            renderPlayers();
        });

        refs.inputs.glevel.addEventListener('input', (event) => {
            let value = Number(event.target.value);
            if (!Number.isFinite(value) || value < 0) value = 0;
            settings.glevel = value;
            localStorage.setItem('conf_glevel', value);
            renderPlayers();
        });

        const checkboxBindings = [
            ['conf_showmp', 'showmp'],
            ['conf_showsp', 'showsp'],
            ['conf_showtp', 'showtp'],
            ['conf_showname', 'showname'],
            ['conf_showkprefix', 'showkprefix'],
            ['conf_showlprefix', 'showlprefix'],
            ['conf_showrankprefix', 'showrankprefix'],
            ['conf_showmprefix', 'showmprefix'],
            ['conf_showsprefix', 'showsprefix']
        ];

        checkboxBindings.forEach(([key, settingKey]) => {
            const input = refs.inputs[settingKey];
            if (!input) return;
            input.addEventListener('change', (event) => {
                const checked = event.target.checked;
                settings[settingKey] = checked;
                localStorage.setItem(key, checked);
                renderPlayers();
            });
        });

        refs.reconnectButton.addEventListener('click', () => {
            connect(true);
        });

        let activePointerId = null;
        let pointerStart = null;
        let pointerTranslate = null;

        refs.mapStage.addEventListener('pointerdown', (event) => {
            activePointerId = event.pointerId;
            pointerStart = { x: event.clientX, y: event.clientY };
            pointerTranslate = { x: state.viewport.translateX, y: state.viewport.translateY };
            refs.mapStage.classList.add('dragging');
            refs.mapStage.setPointerCapture(activePointerId);
        });

        refs.mapStage.addEventListener('pointermove', (event) => {
            if (event.pointerId !== activePointerId || !pointerStart) return;
            const dx = event.clientX - pointerStart.x;
            const dy = event.clientY - pointerStart.y;
            state.viewport.translateX = pointerTranslate.x + dx;
            state.viewport.translateY = pointerTranslate.y + dy;
            applyTransform();
        });

        function releasePointer(event) {
            if (event.pointerId !== activePointerId) return;
            refs.mapStage.classList.remove('dragging');
            refs.mapStage.releasePointerCapture(activePointerId);
            activePointerId = null;
            pointerStart = null;
            pointerTranslate = null;
        }

        refs.mapStage.addEventListener('pointerup', releasePointer);
        refs.mapStage.addEventListener('pointercancel', releasePointer);

        refs.mapStage.addEventListener('wheel', (event) => {
            event.preventDefault();
            const rect = refs.mapStage.getBoundingClientRect();
            const point = {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
            const factor = event.deltaY < 0 ? 1.12 : 0.88;
            zoomAt(point, factor);
        }, { passive: false });

        refs.mapStage.addEventListener('dblclick', (event) => {
            const rect = refs.mapStage.getBoundingClientRect();
            const point = {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
            zoomAt(point, 1.35);
        });

        refs.zoomIn.addEventListener('click', () => {
            const rect = refs.mapStage.getBoundingClientRect();
            zoomAt({ x: rect.width / 2, y: rect.height / 2 }, 1.18);
        });

        refs.zoomOut.addEventListener('click', () => {
            const rect = refs.mapStage.getBoundingClientRect();
            zoomAt({ x: rect.width / 2, y: rect.height / 2 }, 0.85);
        });

        refs.zoomReset.addEventListener('click', () => {
            resetViewport();
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                renderPlayers();
            }, 150);
        });

        window.addEventListener('beforeunload', () => {
            clearTimeout(state.reconnectTimer);
            clearSocket();
        });

        resizeCanvas();
        updateStatus('connecting', '等待连接');
        setOverlayState('loading', '等待连接...', '正在尝试与服务器建立通信');
        connect();
    </script>
</body>

</html>
