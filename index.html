<!doctype html>
<html lang="zh-CN" class="h-full ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOZi 网页雷达</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#020617">
    <link href="./styles.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", "STHeiti", "SimHei", sans-serif;
            font-variant-east-asian: proportional-width;
            font-variant-numeric: proportional-nums lining-nums;
            font-feature-settings: "pwid" 1, "fwid" 0;
            background:
                    radial-gradient(ellipse at top, rgba(16, 185, 129, 0.08), transparent 55%),
                    radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.05), transparent 60%),
                    #020617;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .glass-panel {
            background-color: rgba(15, 23, 42, 0.64);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(18px);
        }

        #mapStage {
            touch-action: none;
            cursor: grab;
            max-width: 100%;
            max-height: 100%;
        }

        #mapStage.dragging {
            cursor: grabbing;
        }

        #mapViewport {
            position: absolute;
            inset: 0;
            transform-origin: top left;
        }

        #mapViewport img,
        #mapViewport canvas {
            position: absolute;
            inset: 0;
        }

        #mapViewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        #mapViewport canvas {
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #mapOverlay {
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        #mapOverlay[data-state="hidden"] {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #mapOverlay [data-role="spinner"] {
            display: none;
        }

        #mapOverlay[data-state="loading"][data-reconnect="false"] [data-role="spinner"] {
            display: block;
        }

        #mapOverlay [data-role="reconnect"] {
            display: none;
        }

        #mapOverlay[data-reconnect="true"] [data-role="reconnect"] {
            display: inline-flex;
        }

        .three-column-layout {
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .three-column-layout > * {
            min-width: 0;
        }

        .map-stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .map-controls-outlet {
            margin-top: 0.5rem;
            width: 100%;
        }

        #mapControls button {
            touch-action: manipulation;
        }

        @media (min-width: 1024px) {
            [data-role="player-table-section"].player-table-hidden {
                display: none !important;
            }

            .three-column-layout {
                display: grid;
                grid-template-columns: 320px auto minmax(320px, 1fr);
                column-gap: 4px;
                row-gap: 4px;
                align-items: stretch;
            }

            .three-column-layout.player-table-hidden {
                grid-template-columns: 300px minmax(0, 1fr);
            }

            .three-column-layout > * {
                min-height: 0;
            }

            .config-column {
                display: flex;
                flex-direction: column;
                min-height: 0;
                max-height: 100vh;
            }

            .config-stack {
                flex: 1;
                overflow-y: visible;
                scrollbar-width: thin;
                min-height: 0;
            }

            .map-shell {
                display: flex;
                align-items: flex-start;
                justify-content: center;
                min-height: 0;
            }

            .map-stage-container {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0;
            }

            .player-table-shell {
                height: 100%;
                overflow: hidden;
                max-height: 100vh;
            }

            .player-table-wrapper {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
            }

            .player-table-scroll {
                flex: 1;
                min-height: 0;
            }

            .map-controls-outlet {
                margin-top: 0;
            }

            #mapStage #mapControls {
                position: absolute;
                left: 1rem;
                bottom: 1rem;
                margin: 0;
                max-width: calc(100% - 2rem);
                transform: none;
                z-index: 2;
            }
        }

        @media (max-width: 640px) {
            header .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            main .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            body {
                background-position: center;
            }
        }

        .player-table-wrapper {
            background-color: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(71, 85, 105, 0.55);
        }

        .player-table thead th {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.88));
            color: rgb(226, 232, 240);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .player-table-row {
            transition: background-color 160ms ease, color 160ms ease;
        }

        .player-table-row-band-0 {
            background-color: rgba(15, 23, 42, 0.78);
        }

        .player-table-row-band-1 {
            background-color: rgba(30, 41, 59, 0.78);
        }

        .player-table-row:hover {
            background-color: rgba(34, 197, 94, 0.12);
        }
    </style>
</head>

<body class="h-full text-slate-100 flex flex-col overflow-hidden">
<header class="w-full border-b border-slate-800/60 bg-slate-950/60 backdrop-blur-xl">
    <div class="mx-auto flex w-full max-w-7xl flex-col gap-4 px-3 py-4 sm:px-5 lg:flex-row lg:items-end lg:gap-6">
        <div class="flex items-start gap-4">
            <div class="flex size-12 items-center justify-center rounded-2xl bg-slate-900/80 ring-1 ring-emerald-500/40">
                <img data-role="brand-logo" data-asset-name="default.png" alt="HOOZi" class="h-8 w-8 object-contain" draggable="false" referrerpolicy="origin">
            </div>
            <div class="space-y-1">
                <h1 class="text-2xl font-semibold text-white sm:text-3xl" data-i18n="header.title">HOOZi 网页雷达</h1>
                <div class="flex items-center gap-1.5 text-[0.7rem] text-slate-400">
                    <span data-i18n="header.connectionStatusLabel">连接状态</span>
                    <span data-role="status-indicator"
                          class="size-2.5 rounded-full bg-slate-500 shadow-inner shadow-black/50 transition"></span>
                    <span data-role="status-text" class="text-[0.75rem] font-medium text-slate-200" data-i18n="status.waiting">
                            等待连接
                        </span>
                    <a href="https://m.tb.cn/h.SP0IB1U?tk=dfDef38nAvO" target="_blank" rel="noopener noreferrer" class="mx-2 text-[0.9rem] hover:text-emerald-300" data-i18n="header.purchaseLink">HOOZi卡密购买</a>
                </div>
            </div>
        </div>
        <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-end sm:justify-end lg:ml-auto lg:w-auto">
            <div class="w-full sm:w-auto">
                <label for="sel_player" class="text-xs text-slate-400" data-i18n="header.watchPlayerLabel">关注玩家</label>
                <select id="sel_player" autocomplete="off"
                        class="mt-1 min-w-[180px] rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm font-medium text-slate-100 outline-none focus:border-emerald-400/70 focus:ring-2 focus:ring-emerald-500/40">
                    <option value="<hoozi>">hoozi</option>
                </select>
            </div>
        </div>
    </div>
</header>
<main class="w-full flex-1">
    <div class="three-column-layout mx-auto w-full px-1 pb-1 sm:px-2" data-role="layout">
        <aside class="config-column w-full overflow-y-auto overscroll-none">
            <div class="config-stack flex flex-1 flex-col space-y-4">
                <section class="glass-panel rounded-3xl p-4" data-role="map-selector">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.mapSelect">选择地图</h2>
                        <label class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.08em] text-slate-400">
                            <input id="conf_map_auto" type="checkbox" checked
                                   class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            <span data-i18n="config.mapAuto">自动</span>
                        </label>
                    </div>
                    <div class="mt-3 grid grid-cols-3 gap-2" data-role="map-selector-options">
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="1" aria-pressed="false">
                            <span data-i18n="mapNames.1">诸王峡谷</span>
                        </button>
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="2" aria-pressed="false">
                            <span data-i18n="mapNames.2">世界尽头</span>
                        </button>
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="3" aria-pressed="false">
                            <span data-i18n="mapNames.3">奥林匹斯</span>
                        </button>
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="4" aria-pressed="false">
                            <span data-i18n="mapNames.4">残月</span>
                        </button>
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="5" aria-pressed="false">
                            <span data-i18n="mapNames.5">风暴点</span>
                        </button>
                        <button type="button" class="map-option flex flex-col items-center justify-center rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-3 text-center text-sm text-slate-200 transition hover:border-emerald-400/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50" data-map-option="6" aria-pressed="false">
                            <span data-i18n="mapNames.6">电气区</span>
                        </button>
                    </div>
                </section>
                <section class="glass-panel rounded-3xl p-4">
                    <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.toggles">信息开关</h2>
                    <div class="mt-3 space-y-2">
                        <div class="grid grid-cols-3 gap-1.5 text-sm text-slate-200">
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showname" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleName">昵称</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showlprefix" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleLevel">等级</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showrankprefix" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleRank">段位</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5 text-sm text-slate-200">
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showkprefix" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleKills">击杀</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showmprefix" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleRoster">名册</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showsprefix" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleSuspect">嫌疑</span>
                            </label>
                        </div>
                    </div>
                </section>
                <section class="glass-panel rounded-3xl p-4">
                    <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.quickFilter">快捷过滤</h2>
                    <div class="mt-3 space-y-2.5">
                        <label class="flex items-center gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-1.5 text-sm transition hover:border-emerald-400/60">
                            <input id="conf_showmp" type="checkbox"
                                   class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            <span class="text-slate-200" data-i18n="config.filterOnlyMarks">仅显示 权 / 黑 / 白</span>
                        </label>
                        <label class="flex items-center gap-3 rounded-2xl border border-slate-800/70 bg-slate-950/40 px-3 py-1.5 text-sm transition hover:border-emerald-400/60">
                            <input id="conf_showsp" type="checkbox"
                                   class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            <span class="text-slate-200" data-i18n="config.filterOnlySuspicious">仅显示 低等级 / 高击杀</span>
                        </label>
                        <div class="grid grid-cols-3 gap-2.5 text-[0.7rem] uppercase text-slate-500">
                            <label class="space-y-2">
                                <span data-i18n="config.fontSize">字体大小</span>
                                <input id="conf_fontsize" type="number" min="6" max="48" step="1"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-1.5 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                            <label class="space-y-2">
                                <span data-i18n="config.killsAtLeast">击杀达到</span>
                                <input id="conf_gkill" type="number" min="0" step="1"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-1.5 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                            <label class="space-y-2">
                                <span data-i18n="config.levelBelow">等级低于</span>
                                <input id="conf_glevel" type="number" min="0" step="1"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-1.5 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                        </div>
                    </div>
                </section>
                <section class="glass-panel hidden rounded-3xl p-4 lg:block" data-role="player-table-menu">
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.playerTable">玩家信息列表</span>
                        <label class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.08em] text-slate-400">
                            <input id="conf_table_visible" type="checkbox"
                                   class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                            <span data-role="player-table-toggle-label" data-i18n="config.playerTableShow">显示</span>
                        </label>
                    </div>
                    <div class="mt-3 space-y-2 text-sm text-slate-200">
                        <div class="grid grid-cols-3 gap-1.5">
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_team" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.team">队伍</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_name" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.name">昵称</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_level" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.level">等级</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_rank" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.rank">段位</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_kills" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.kills">击杀</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_marks" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.marks">标记</span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2 gap-1.5">
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_uid_short" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.uidShort">短UID</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_table_uid_long" type="checkbox"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="table.columns.uidLong">长UID</span>
                            </label>
                        </div>
                    </div>
                </section>
                <section class="glass-panel rounded-3xl p-4" data-role="connection-config">
                    <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.connection">连接配置</h2>
                    <div class="mt-3 space-y-2">
                        <label class="sr-only" for="conf_ipaddr" data-i18n="config.connection">连接配置</label>
                        <input id="conf_ipaddr" type="text" placeholder="auto"
                               class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                               data-i18n-placeholder="config.ipPlaceholder">
                        <p class="text-[0.7rem] text-slate-500" data-i18n="config.ipHelper">auto自动, 或手动填写ws/wss地址</p>
                    </div>
                </section>
            </div>
        </aside>
        <section class="map-shell">
            <div class="map-stage-container relative flex flex-1 flex-col">
                <div id="mapStage"
                     class="glass-panel relative aspect-square w-full overflow-hidden rounded-[1.75rem] border border-slate-800/80">
                    <div id="mapViewport" class="absolute inset-0">
                        <img id="mapImage" src="" alt="" draggable="false" referrerpolicy="origin">
                        <canvas id="mapCanvas"></canvas>
                    </div>
                    <div id="mapOverlay" data-state="loading" data-reconnect="false"
                         class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-slate-950/70 text-slate-200"
                         role="status" aria-live="polite">
                        <div data-role="spinner"
                             class="h-12 w-12 rounded-full border-4 border-slate-700 border-t-emerald-400 animate-spin"></div>
                        <button id="reconnectButton" type="button" data-role="reconnect"
                                class="shrink-0 rounded-xl border border-emerald-500/60 bg-emerald-500/10 px-4 py-2 text-[0.75rem] font-semibold text-emerald-300 transition hover:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/60"
                                data-i18n="map.reconnect">
                            重连
                        </button>
                        <div class="space-y-1 px-4 text-center">
                            <p id="overlayTitle" class="text-lg font-semibold" data-i18n="overlay.waitingTitle">等待连接</p>
                            <p id="overlaySubtitle" class="text-sm text-slate-400" data-i18n="overlay.waitingSubtitle">正在尝试与服务器建立通信</p>
                        </div>
                    </div>
                    <div
                            class="absolute top-3 right-3 flex items-center gap-1.5 rounded-full border border-slate-700 bg-slate-950/70 px-2 py-0.5 text-[0.7rem] uppercase text-slate-300">
                        <span data-i18n="map.playerCountLabel">玩家</span>
                        <span id="playerCount" class="text-sm font-semibold text-white">0</span>
                    </div>
                </div>
                <div class="map-controls-outlet" data-role="map-controls-outlet">
                    <div id="mapControls"
                         class="flex flex-wrap items-center justify-between gap-2 rounded-2xl border border-slate-700/70 bg-slate-950/80 px-2.5 py-1.5 text-xs text-slate-200 lg:border-slate-700/60 lg:bg-slate-950/60">
                        <div class="map-zoom-panel flex shrink-0 items-center gap-1.5">
                            <button id="zoomOut" type="button"
                                    class="rounded-full border border-slate-700 bg-slate-950/70 px-2 py-0.5 text-xs text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                                -
                            </button>
                            <button id="zoomReset" type="button"
                                    class="rounded-full border border-slate-700 bg-slate-950/70 px-2.5 py-0.5 text-xs text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                                <span data-i18n="map.zoomReset">重置</span>
                            </button>
                            <button id="zoomIn" type="button"
                                    class="rounded-full border border-slate-700 bg-slate-950/70 px-2 py-0.5 text-xs text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60">
                                +
                            </button>
                        </div>
                        <div id="focusPanel" class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
                            <span class="text-[0.6rem] uppercase text-slate-500" data-i18n="map.focusLabel">焦点</span>
                            <span id="focusTeamBadge" class="size-2 rounded-full bg-slate-500"></span>
                            <span id="focusPlayerName" class="max-w-[140px] truncate text-sm font-semibold text-white sm:max-w-[240px]">—</span>
                            <span id="focusMeta"
                                  class="rounded-full border border-slate-700/70 bg-slate-900/70 px-2 py-0.5 text-[0.65rem] font-medium text-slate-200">
                                    Lv — · K —
                                </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="hidden lg:flex lg:h-full lg:flex-shrink-0" data-role="player-table-section">
            <div class="player-table-shell glass-panel flex h-full w-full flex-col rounded-3xl p-2" data-role="player-table-shell">
                <div class="flex items-center justify-between">
                    <h2 class="pl-2 text-sm font-semibold uppercase text-slate-300" data-i18n="table.title">玩家信息</h2>
                    <button id="downloadLatestButton" type="button" disabled
                            class="rounded-full border border-slate-700/70 bg-slate-900/60 px-3 py-1 text-[0.7rem] font-semibold text-slate-300 transition hover:border-slate-500/60 hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-500/30 disabled:cursor-not-allowed disabled:opacity-50"
                            data-i18n="config.downloadLatest">导出玩家列表</button>
                </div>
                <div class="player-table-wrapper mt-3 flex-1 overflow-hidden rounded-2xl" data-role="player-table-wrapper">
                    <div class="h-full overflow-auto" data-role="player-table-scroll">
                        <table class="player-table w-full text-sm text-slate-200">
                            <thead>
                            <tr data-role="player-table-header"></tr>
                            </thead>
                            <tbody data-role="player-table-body">
                            <tr data-role="player-table-empty">
                                <td data-role="player-table-empty-cell" class="px-2.5 py-5 text-center text-xs text-slate-500" data-i18n="table.empty">等待玩家数据</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<footer class="w-full py-2 border-t border-slate-800/60 bg-slate-950/80 backdrop-blur-xl text-sm text-slate-700">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-center items-center sm:space-x-3 px-3 gap-1">
        <p data-i18n="footer.copyright">Copyright © hoozi.net 版权所有</p>
        <p data-i18n="footer.disclaimer">所有其他商标、标志及著作权均为其各自所有者所有</p>
    </div>
</footer>

<script src="./app.js"></script>

</body>
</html>
