<!doctype html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOZI RADAR | 绿玩之家</title>
    <link rel="stylesheet" href="static/pico.min.css">
    <script src="static/jquery-3.5.1.min.js"></script>
    <script src="static/modal.js"></script>
    <style>
        body {
            overflow: hidden;
        }

        #navbar {
            min-width: 380px;
            height: 40px;
            padding: 0.5rem;

            select,
            button {
                height: 35px;
                border-radius: 5px;
                font-size: 0.7rem;
            }

            button {
                margin-right: -1.5rem;
            }


        }

        #status {
            margin-left: 0.35rem;
            width: 0.5rem;
            height: 0.5rem;
        }

        #map_box {
            margin: 0 auto;
            height: calc(100vh - 80px);
        }

        #map_container {
            border: 1px solid #3D475C;
            border-radius: 0.5rem;
            overflow: hidden;
            position: relative;
            transform-origin: 50% 50%;
            transition: transform .1s ease;
            cursor: move;
            height: 1015px;
            width: 1015px;
            margin: 0 auto;

        }

        #map_img {
            display: block;
            height: 100%;
            user-select: none;
        }

        #map_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="container">
        <nav id="navbar">
            <ul>
                <li>
                    <img src="static/default.png" alt="logo" srcset="" style="margin-top: 5px;">
                </li>
            </ul>
            <ul>
                <!-- 设置按钮，打开设置面板div (⚙) -->
                <li>
                    <button class="btn btn-sm" data-target="settings" onclick="toggleModal(event)">⚙</button>
                </li>
                <li>

                </li>
                <!-- 选择玩家，默认<hoozi> -->
                <li>
                    <select id="sel_player">
                        <option value="<hoozi>">hoozi</option>
                    </select>
                </li>
            </ul>
        </nav>
        <!-- 设置面板 dialog -->
        <dialog id="settings">
            <article>
                <header>
                    <button aria-label="Close" rel="prev" data-target="settings" onclick="toggleModal(event)"></button>
                    <h5>⚙ 设置面板</h5>
                </header>
                <!-- 服务器地址 -->
                <section>
                    <label for="server"><input id="status" type="radio" name="validation-states" aria-invalid="true"
                            data-tooltip="服务器连接失败" data-placement="right" checked />服务器地址</label>
                    <fieldset role="group">
                        <select id="conf_protocol" name="conf_protocol">
                            <option value="auto">auto</option>
                            <option value="ws">ws://</option>
                            <option value="wss">wss://</option>
                        </select>
                        <input id="conf_ipaddr" name="conf_ipaddr" type="text" placeholder="auto" />
                    </fieldset>
                </section>
                <section>
                    <label for="server">字体大小</label>
                    <input id="conf_fontsize" name="conf_fontsize" type="number" placeholder="10" />
                </section>
                <section>
                    <label for="server">嫌疑玩家</label>
                    <fieldset role="group">
                        <input type="button" value="等级低于" disabled />
                        <input id="conf_glevel" name="conf_glevel" type="number" placeholder="250" />
                        <input type="button" value="击杀高于" disabled />
                        <input id="conf_gkill" name="conf_gkill" type="number" placeholder="5" />
                    </fieldset>
                </section>
                <section>
                    <fieldset>
                        <legend data-tooltip="✨不勾选则显示所有玩家位置" data-placement="right">地图设置 <span style="font-size: 0.8rem;">✨不勾选则显示所有玩家位置</span></legend>
                        <!-- 显示名册玩家 -->
                        <input type="checkbox" id="conf_showmp" name="conf_showmp" />
                        <label htmlFor="conf_showmp">名册玩家位置</label>
                        <!-- 显示嫌疑玩家 -->
                        <input type="checkbox" id="conf_showsp" name="conf_showsp" />
                        <label htmlFor="conf_showsp">嫌疑玩家位置</label>
                        <!-- 显示队伍玩家 -->
                        <input type="checkbox" id="conf_showtp" name="conf_showtp" />
                        <label htmlFor="conf_showtp">队伍玩家位置</label>

                    </fieldset>
                </section>
                <br>
                <section>
                    <fieldset>
                        <legend>玩家信息</legend>
                        <!-- 显示昵称 -->
                        <input type="checkbox" id="conf_showname" name="conf_showname" checked />
                        <label htmlFor="conf_showname">昵称信息</label>
                        <!-- 击杀前缀 -->
                        <input type="checkbox" id="conf_showkprefix" name="conf_showkprefix" checked />
                        <label htmlFor="conf_showkprefix">击杀信息</label>
                        <!-- 等级前缀 -->
                        <input type="checkbox" id="conf_showlprefix" name="conf_showlprefix" checked />
                        <label htmlFor="conf_showlprefix">等级信息</label>
                        <!-- 段位 -->
                        <input type="checkbox" id="conf_showrankprefix" name="conf_showrankprefix" checked />
                        <label htmlFor="conf_showrankprefix">段位信息</label>
                        <div></div>
                        <!-- 名册前缀（黑/白/权） -->
                        <input type="checkbox" id="conf_showmprefix" name="conf_showmprefix" checked />
                        <label htmlFor="conf_showmprefix">名册标识</label>
                        <!-- 嫌疑前缀 -->
                        <input type="checkbox" id="conf_showsprefix" name="conf_showsprefix" checked />
                        <label htmlFor="conf_showsprefix">嫌疑标识</label>
                    </fieldset>
                </section>
            </article>
        </dialog>
    </header>
    <div id="map_box">
        <div id="map_container">
            <article id="loadding" aria-busy="true" style="display: block;"></article>
            <img id="map_img" src="" style="display:block;margin:0 auto;user-select:none;" />
            <canvas id="map_canvas"></canvas>
        </div>
    </div>
    <!-- ./ Header -->

        });

        });
        // conf_showtp 选项改变时，保存到本地缓存

        // conf_showname 选项改变时，保存到本地缓存

        // conf_showkprefix 选项改变时，保存到本地缓存

        // conf_showlprefix 选项改变时，保存到本地缓存
        $("#conf_showlprefix").change(function () {

        // conf_showrankprefix 选项改变时，保存到本地缓存

        // conf_showmprefix 选项改变时，保存到本地缓存

        // 网页刚加载时读取缓存的值
        $("#sel_player").val(localStorage.getItem("sel_player") || "<hoozi>");
        $("#conf_protocol").val(localStorage.getItem("conf_protocol") || "auto");

        $("#conf_fontsize").val(localStorage.getItem("conf_fontsize") || 10);
        $("#conf_glevel").val(localStorage.getItem("conf_glevel") || 250);
        $("#conf_gkill").val(localStorage.getItem("conf_gkill") || 5);
        $("#conf_showmp").prop("checked", localStorage.getItem("conf_showmp") === "true");
        $("#conf_showsp").prop("checked", localStorage.getItem("conf_showsp") === "true");
        $("#conf_showtp").prop("checked", localStorage.getItem("conf_showtp") === "true");
        $("#conf_showname").prop("checked", localStorage.getItem("conf_showname") === "true");
        $("#conf_showkprefix").prop("checked", localStorage.getItem("conf_showkprefix") === "true");
        $("#conf_showlprefix").prop("checked", localStorage.getItem("conf_showlprefix") === "true");
        $("#conf_showrankprefix").prop("checked", localStorage.getItem("conf_showrankprefix") === "true");
        $("#conf_showmprefix").prop("checked", localStorage.getItem("conf_showmprefix") === "true");
        $("#conf_showsprefix").prop("checked", localStorage.getItem("conf_showsprefix") === "true");

        function team_color(teamID) {
            const teamColors = [
                "rgba(255, 200, 200, 1)", // Light Red
                "rgba(200, 255, 200, 1)", // Light Green
                "rgba(200, 200, 255, 1)", // Light Blue
                "rgba(255, 255, 200, 1)", // Light Yellow
                "rgba(200, 255, 255, 1)", // Light Cyan
                "rgba(255, 200, 255, 1)", // Light Magenta
                "rgba(255, 160, 160, 1)", // Soft Red
                "rgba(160, 255, 160, 1)", // Soft Green
                "rgba(160, 160, 255, 1)", // Soft Blue
                "rgba(255, 255, 160, 1)", // Soft Yellow
                "rgba(255, 210, 245, 1)", // Soft Pink
                "rgba(230, 230, 230, 1)", // Light Gray
                "rgba(255, 220, 180, 1)", // Light Orange
                "rgba(255, 190, 220, 1)", // Soft Deep Pink
                "rgba(220, 255, 200, 1)", // Light Chartreuse
                "rgba(200, 190, 255, 1)", // Light Indigo
                "rgba(255, 220, 150, 1)", // Bright Orange
                "rgba(200, 240, 200, 1)", // Bright Light Green
                "rgba(255, 200, 180, 1)", // Bright Tomato
                "rgba(255, 245, 200, 1)", // Bright Gold
                "rgba(200, 255, 245, 1)", // Bright Turquoise
                "rgba(220, 245, 255, 1)", // Bright Sky Blue
                "rgba(240, 200, 255, 1)", // Bright Orchid
                "rgba(245, 220, 255, 1)", // Bright Plum
                "rgba(250, 220, 255, 1)", // Bright Violet
                "rgba(200, 245, 255, 1)", // Bright Deep Sky Blue
                "rgba(230, 245, 255, 1)", // Bright Light Blue
                "rgba(255, 200, 200, 1)", // Light Salmon
                "rgba(255, 220, 200, 1)", // Light Dark Salmon
                "rgba(255, 210, 210, 1)", // Light Coral
                "rgba(220, 255, 235, 1)", // Light Aquamarine
                "rgba(210, 230, 255, 1)", // Light Cornflower Blue
                "rgba(200, 220, 255, 1)", // Light Dodger Blue
                "rgba(245, 245, 245, 1)", // Very Light Grey
                "rgba(255, 210, 230, 1)", // Light Pink
                "rgba(255, 220, 235, 1)", // Bright Pink
                "rgba(255, 230, 240, 1)", // Soft Bright Pink
                "rgba(255, 200, 240, 1)", // Bright Deep Pink
                "rgba(220, 255, 220, 1)", // Bright Spring Green
                "rgba(210, 255, 220, 1)", // Light Sea Green
                "rgba(220, 255, 220, 1)", // Pale Green
                "rgba(200, 255, 200, 1)", // Light Green
                "rgba(240, 255, 200, 1)", // Bright Chartreuse
                "rgba(210, 255, 210, 1)", // Light Lime
                "rgba(255, 210, 200, 1)", // Bright Orange Red
                "rgba(200, 255, 255, 1)"  // Bright Teal
            ];


            return teamColors[teamID % teamColors.length];
        }
        const local_team_color = "#FFFFFF";

        const map_container = document.getElementById("map_container");
        const map_img = document.getElementById("map_img");
        const loadding = document.getElementById("loadding");
        const map_canvas = document.getElementById("map_canvas");
        const ctx = map_canvas.getContext("2d");
        let is_dragging = false;
        let start_x = 0;
        let start_y = 0;
        let start_transform = "";
        let current_translate_x = 0;
        let current_translate_y = 0;
        let scale = 1;
        let scale_amount = 0.1;

        // 鼠标事件
        map_container.addEventListener('mousedown', function (e) {
            is_dragging = true;
            start_x = e.clientX;
            start_y = e.clientY;
            start_transform = window.getComputedStyle(map_container).getPropertyValue('transform');
            e.preventDefault();
        });
        map_container.addEventListener('mousemove', function (e) {
            if (is_dragging) {
                const dx = e.clientX - start_x;
                const dy = e.clientY - start_y;
                let matrix = new WebKitCSSMatrix(start_transform);
                current_translate_x = matrix.m41 + dx;
                current_translate_y = matrix.m42 + dy;
                map_container.style.transform = `translate(${current_translate_x}px, ${current_translate_y}px) scale(${scale})`;
            }
        });
        map_container.addEventListener('mouseup', function () {
            is_dragging = false;
        });
        map_container.addEventListener('wheel', function (e) {
            e.preventDefault();
            let rect = map_container.getBoundingClientRect(),
                offset_x = e.clientX - rect.left,
                offset_y = e.clientY - rect.top;
            if (e.deltaY < 0) {
                if (scale > scale_amount) scale += scale_amount;
            } else {
                scale -= scale_amount;
            }
            let new_center_x = offset_x / scale;
            let new_center_y = offset_y / scale;
            current_translate_x -= (offset_x - new_center_x * scale) * (scale - 1);
            current_translate_y -= (offset_y - new_center_y * scale) * (scale - 1);

            let matrix = new WebKitCSSMatrix(window.getComputedStyle(map_container).getPropertyValue('transform'));
            let centerX = (matrix.m41 + map_container.offsetWidth / 2) / scale;
            let centerY = (matrix.m42 + map_container.offsetHeight / 2) / scale;
            let newTranslateX = centerX * scale - map_container.offsetWidth / 2;
            let newTranslateY = centerY * scale - map_container.offsetHeight / 2;
            map_container.style.transform = `translate(${newTranslateX}px, ${newTranslateY}px) scale(${scale})`;

        }, {
            passive: false
        });
        // 手机事件
        function getDistance(event) {
            let touches = event.touches;
            let dx = touches[0].pageX - touches[1].pageX;
            let dy = touches[0].pageY - touches[1].pageY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        map_container.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                lastDistance = getDistance(e);
            }
        });

        map_container.addEventListener('touchend', function (e) {
            if (e.touches.length < 2) {
                lastDistance = -1;
            }
        });

        // 绘制玩家
        function draw_players(players) {
            // 创建画布缓冲区
            const buffer = document.createElement('canvas');
            buffer.width = map_canvas.width;
            buffer.height = map_canvas.height;
            const bctx = buffer.getContext('2d');
            // 获取设置
            const sel_player = $("#sel_player").val();
            const conf_fontsize = $("#conf_fontsize").val();
            const conf_glevel = $("#conf_glevel").val();
            const conf_gkill = $("#conf_gkill").val();
            const conf_showmp = $("#conf_showmp").is(":checked"); // 显示名册玩家
            const conf_showsp = $("#conf_showsp").is(":checked"); // 显示嫌疑玩家
            const conf_showtp = $("#conf_showtp").is(":checked"); // 显示队伍玩家
            const conf_showname = $("#conf_showname").is(":checked");
            const conf_showkprefix = $("#conf_showkprefix").is(":checked");
            const conf_showlprefix = $("#conf_showlprefix").is(":checked");
            const conf_showrankprefix = $("#conf_showrankprefix").is(":checked");
            const conf_showmprefix = $("#conf_showmprefix").is(":checked");
            const conf_showsprefix = $("#conf_showsprefix").is(":checked");

            // 不勾选则显示所有玩家信息
            const conf_showall = !conf_showmp && !conf_showsp && !conf_showtp;

            // 设置字体 微软雅黑加粗
            bctx.font = `${conf_fontsize}px 微软雅黑 bold`;
            bctx.textAlign = 'center';
            // 体积碰撞缓存，用于判断昵称是否重叠
            const text_cache = [];
            // 选中玩家
            let local_player = players.find(p => p.name === sel_player);
            const local_x = local_player.pos.x;
            const local_y = local_player.pos.y;

            // 绘制玩家信息并判定体积碰撞
            players.forEach(player => {
                // 判断玩家颜色
                const color = player.team == local_player.team ? local_team_color : team_color(player.team);
                const x = player.pos.x;
                const y = player.pos.y;

                // 绘制玩家圆形
                bctx.beginPath();
                bctx.arc(x, y, 4.5, 0, 2 * Math.PI);
                bctx.fillStyle = color;
                bctx.fill();
                bctx.lineWidth = 1;
                bctx.strokeStyle = '#000000';
                bctx.stroke();

                // 队友连接线
                if (player.team == local_player.team) {
                    bctx.lineWidth = 1.5;
                    bctx.strokeStyle = color;
                    bctx.moveTo(local_x, local_y);
                    bctx.lineTo(x, y);
                    bctx.stroke();
                }

                // 绘制玩家信息
                if (conf_showmp || conf_showsp || conf_showtp || conf_showall) {
                    let level_low = player.level < conf_glevel;
                    let kill_high = player.kills > conf_gkill;
                    let is_roster = player.pro || player.white || player.black;

                    // 排除自己和选中的玩家
                    if (player.name === sel_player) {
                        return;
                    }

                    if (!conf_showall) {
                        let show_player = false; // 默认不显示

                        // 如果配置显示队伍玩家，且玩家属于同一队伍
                        if (conf_showtp && player.team === local_player.team) {
                            show_player = true;
                        }

                        // 如果配置显示名册玩家，且玩家是名册成员
                        if (conf_showmp && is_roster) {
                            show_player = true;
                        }

                        // 如果配置显示嫌疑玩家，且玩家是嫌疑对象
                        if (conf_showsp && (level_low || kill_high)) {
                            show_player = true;
                        }
                        // 如果玩家不符合任何条件，剔除
                        if (!show_player) return;
                    }

                    let text = "";
                    if (player.team != local_player.team) {
                        if (conf_showmprefix && is_roster) text += " [" + (player.pro ? "权" : player.white ? "白" : player.black ? "黑" : "") + "]";
                        if (conf_showsprefix && (level_low || kill_high)) {
                            if (level_low && kill_high) text += " [嫌]";
                            else {
                                if (level_low) text += " [低级]";
                                if (kill_high) text += " [高杀]";
                            }
                        }
                        if (conf_showkprefix) text += " [K:" + player.kills + "]";
                        if (conf_showlprefix) text += " [Lv:" + player.level + "]";
                        if (conf_showrankprefix) text += " [" + player.rank + "]";
                    }
                    if (conf_showname) text += player.name;
                    if (text.length > 38) text = text.substring(0, 38) + "...";

                    // 判定体积碰撞
                    const fontSize = parseInt($("#conf_fontsize").val());
                    const textHeight = fontSize * 1.2; // 1.2 是行高调整系数
                    let adjustedY = y - fontSize;

                    text_cache.forEach(cachedText => {
                        if (cachedText.team === player.team) { // 检测同队伍玩家的文本
                            const { cx, cy, width, height } = cachedText;
                            const dx = Math.abs(cx - x);
                            const dy = Math.abs(cy - adjustedY);
                            if (dx < width / 2 && dy < height) {
                                adjustedY -= height; // 如果有碰撞，继续向上偏移
                            }
                        }
                    });

                    // 绘制玩家昵称信息
                    bctx.lineWidth = 2;
                    bctx.strokeStyle = "rgba(5,5,5,1)";
                    bctx.strokeText(text, x, adjustedY);
                    bctx.fillStyle = color;
                    bctx.fillText(text, x, adjustedY);
                    bctx.closePath();

                    // 缓存当前文本信息位置
                    const textWidth = bctx.measureText(text).width;
                    text_cache.push({ cx: x, cy: adjustedY, width: textWidth, height: textHeight, team: player.team });
                }
            });


            // 选中玩家十字线
            bctx.beginPath();
            bctx.lineWidth = 1.5;
            bctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            bctx.moveTo(0, local_y);
            bctx.lineTo(map_canvas.width, local_y);
            bctx.moveTo(local_x, 0);
            bctx.lineTo(local_x, map_canvas.height);
            bctx.stroke();
            bctx.closePath();

            // 将缓冲区绘制到画布
            ctx.drawImage(buffer, 0, 0);
        }

        $(document).ready(function () {
            function connect() {
                // 创建连接
                var ipaddr = ($("#conf_ipaddr").val() || "auto").trim();
                var protocol = ($("#conf_protocol").val() || "auto").trim();

                if (protocol === "auto") {
                    protocol = window.location.protocol === "https:" ? "wss" : "ws";
                }

                if (ipaddr === "" || ipaddr === "auto") {
                    ipaddr = window.location.host + "/ws"; // 自动获取本机IP
                }

                var socket_url = ipaddr.includes("://") ? ipaddr : `${protocol}://${ipaddr}`;
                if (socket_url.startsWith("http://")) {
                    socket_url = "ws://" + socket_url.substring(7);
                } else if (socket_url.startsWith("https://")) {
                    socket_url = "wss://" + socket_url.substring(8);
                }
                var socket = new WebSocket(socket_url);

                // 设置连接状态
                socket.onopen = function () {
                    loadding.style.display = "none";
                    $("#status").attr("data-tooltip", "服务器连接成功").attr("aria-invalid", "false");
                };

                // 接收服务器消息
                socket.onmessage = function (event) {
                    if (settings_open) { return; }
                    loadding.style.display = "none";
                    const data = JSON.parse(event.data);

                    // 调整画布背景和玩家位置
                    if (data.map) {
                        var map_src = "static/" + data.map + ".png";
                        if (map_src !== map_img.src) {
                            map_img.src = map_src; // 更新地图
                            // 更新玩家列表
                            if (data.players) {
                                data.players.sort((a, b) => a.team - b.team); // 按队伍排序

                                // 清空并重新填充玩家选择框
                                const sel_local = $("#sel_player");
                                sel_local.empty();
                                data.players.forEach(player => {
                                    sel_local.append(`<option value="${player.name}" style="color:${team_color(parseInt(player.team))};">${player.name === '<hoozi>' ? "hoozi" : player.name}</option>`);
                                });

                                // 读取缓存选中的值，无则默认为<hoozi>
                                const sel_val = localStorage.getItem("sel_player") || "<hoozi>";
                                sel_local.val(sel_val);
                            }
                        }

                        // 加载地图后绘制玩家
                        map_img.onload = function () {
                            map_canvas.width = 1920;
                            map_canvas.height = 1080;
                            map_canvas.style.left = map_img.offsetLeft - 454 + "px";
                            map_canvas.style.top = map_img.offsetTop + "px";
                            ctx.clearRect(0, 0, map_canvas.width, map_canvas.height);
                            requestAnimationFrame(() => draw_players(data.players));
                        };

                    } else {
                        map_img.src = "";
                        loadding.style.display = "block";
                        ctx.clearRect(0, 0, map_canvas.width, map_canvas.height);
                    }
                };

                // 连接关闭时重试
                socket.onclose = function () {
                    map_img.src = "";
                    loadding.style.display = "block";
                    ctx.clearRect(0, 0, map_canvas.width, map_canvas.height);
                    $("#status").attr("data-tooltip", "服务器连接失败").attr("aria-invalid", "true");
                    setTimeout(connect, 1000); // 1秒后重试
                };
            }

            connect(); // 初始化连接
        });

    </script>
</body>

</html>
