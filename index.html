<!doctype html>
<html lang="zh-CN" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOZi 3.0 网页雷达</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#020617">
    <link href="./styles.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", "STHeiti", "SimHei", sans-serif;
            font-variant-east-asian: proportional-width;
            font-variant-numeric: proportional-nums lining-nums;
            font-feature-settings: "pwid" 1, "fwid" 0;
            background:
                    radial-gradient(ellipse at top, rgba(16, 185, 129, 0.08), transparent 55%),
                    radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.05), transparent 60%),
                    #020617;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .glass-panel {
            background-color: rgba(15, 23, 42, 0.64);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(18px);
        }

        #mapStage {
            touch-action: none;
            cursor: grab;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
        }

        #mapStage.dragging {
            cursor: grabbing;
        }

        #mapViewport {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            will-change: transform;
        }

        #mapViewport img,
        #mapViewport canvas {
            position: absolute;
            inset: 0;
        }

        #mapViewport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
            z-index: 0;
        }

        #mapViewport[data-map-mode="lobby"] {
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }

        #mapViewport[data-map-mode="lobby"] canvas {
            display: none;
        }

        #mapViewport canvas {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #mapZoneCanvas {
            z-index: 1;
        }

        #mapCanvas {
            z-index: 2;
        }

        #mapOverlay {
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        #mapOverlay[data-state="hidden"] {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #mapOverlay [data-role="spinner"] {
            display: none;
        }

        #mapOverlay[data-state="loading"][data-reconnect="false"] [data-role="spinner"] {
            display: block;
        }

        #mapOverlay [data-role="reconnect"] {
            display: none;
        }

        #mapOverlay[data-reconnect="true"] [data-role="reconnect"] {
            display: inline-flex;
        }

        .three-column-layout {
            display: flex;
            gap: 4px;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .three-column-layout > * {
            min-width: 0;
        }

        .three-column-layout[data-layout-orientation="landscape"] {
            display: grid;
            grid-template-columns: minmax(260px, 300px) minmax(320px, 1fr) minmax(240px, 320px);
            align-items: stretch;
            overflow: auto;
        }

        .three-column-layout[data-layout-orientation="landscape"][data-menu-visible="false"] {
            grid-template-columns: minmax(320px, 1fr) minmax(240px, 320px);
        }

        .three-column-layout[data-layout-orientation="landscape"][data-table-visible="false"] {
            grid-template-columns: minmax(260px, 300px) minmax(320px, 1fr);
        }

        .three-column-layout[data-layout-orientation="landscape"][data-menu-visible="false"][data-table-visible="false"] {
            grid-template-columns: minmax(320px, 1fr);
        }

        .three-column-layout[data-layout-orientation="portrait"] {
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .three-column-layout[data-layout-orientation="portrait"] .map-shell {
            order: 1;
            flex: 0 0 auto;
            width: 100%;
        }

        .three-column-layout[data-layout-orientation="portrait"] .map-stage-container {
            align-items: stretch;
            width: 100%;
        }

        .three-column-layout[data-layout-orientation="portrait"] #mapStage {
            width: 100%;
            aspect-ratio: 1 / 1.12;
        }

        .three-column-layout[data-layout-orientation="portrait"] [data-role="player-table-section"] {
            order: 2;
            flex: 0 0 auto;
            height: auto;
            min-height: 0;
        }

        .three-column-layout[data-layout-orientation="portrait"] .player-table-shell,
        .three-column-layout[data-layout-orientation="portrait"] .player-table-wrapper,
        .three-column-layout[data-layout-orientation="portrait"] [data-role="player-table-scroll"] {
            height: auto;
            min-height: 0;
        }

        .three-column-layout[data-layout-orientation="portrait"] .player-table-wrapper {
            flex: 0 0 auto;
            overflow-x: hidden;
            overflow-y: visible;
        }

        .three-column-layout[data-layout-orientation="portrait"] [data-role="player-table-scroll"] {
            overflow-x: auto;
            overflow-y: hidden;
        }

        .three-column-layout[data-layout-orientation="portrait"] .config-column {
            order: 3;
            flex: 0 0 auto;
        }

        .three-column-layout[data-menu-visible="false"] .config-column,
        .three-column-layout[data-table-visible="false"] [data-role="player-table-section"] {
            display: none !important;
        }

        .three-column-layout[data-layout-orientation="portrait"][data-menu-visible="false"][data-table-visible="false"] {
            overflow: hidden;
        }

        .three-column-layout[data-layout-orientation="portrait"][data-menu-visible="false"][data-table-visible="false"] .map-shell {
            flex: 1 1 auto;
            min-height: 0;
        }

        .three-column-layout[data-layout-orientation="portrait"][data-menu-visible="false"][data-table-visible="false"] .map-stage-container {
            position: relative;
            height: 100%;
            min-height: 0;
        }

        .three-column-layout[data-layout-orientation="portrait"][data-menu-visible="false"][data-table-visible="false"] #mapStage {
            height: 100%;
            aspect-ratio: auto;
        }

        .three-column-layout[data-layout-orientation="portrait"][data-menu-visible="false"][data-table-visible="false"] .map-controls-outlet {
            position: absolute;
            left: 0.75rem;
            right: 0.75rem;
            bottom: 0.75rem;
            z-index: 2;
            margin-top: 0;
            width: auto;
        }

        .map-stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .map-controls-outlet {
            margin-top: 0.5rem;
            width: 100%;
        }

        #mapControls button {
            touch-action: manipulation;
        }

        @media (min-width: 1024px) {
            .three-column-layout[data-layout-orientation="landscape"] {
                display: grid;
                grid-template-columns: 300px minmax(0, 1fr) 320px;
                column-gap: 5px;
                row-gap: 5px;
                align-items: stretch;
                height: 100%;
            }

            .three-column-layout > * {
                min-height: 0;
            }

            .three-column-layout[data-layout-orientation="landscape"] .config-column {
                display: flex;
                flex-direction: column;
                min-height: 0;
                height: 100%;
            }

            .three-column-layout[data-layout-orientation="landscape"] .config-stack {
                flex: 1;
                overflow-y: visible;
                scrollbar-width: thin;
                min-height: 0;
            }

            .three-column-layout[data-layout-orientation="landscape"] .map-shell {
                display: flex;
                align-items: stretch;
                justify-content: stretch;
                width: 100%;
                height: 100%;
                min-height: 0;
                overflow: hidden;
            }

            .three-column-layout[data-layout-orientation="landscape"] .map-stage-container {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                width: 100%;
                height: 100%;
                min-height: 0;
            }

            .three-column-layout[data-layout-orientation="landscape"] #mapStage {
                width: 100%;
                height: 100%;
                min-height: 0;
                aspect-ratio: auto;
            }

            .three-column-layout[data-layout-orientation="landscape"] .player-table-shell {
                height: 100%;
                min-width: 0;
                overflow: hidden;
            }

            .three-column-layout[data-layout-orientation="landscape"] .player-table-wrapper {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
            }

            .three-column-layout[data-layout-orientation="landscape"] [data-role="player-table-scroll"] {
                flex: 1;
                min-height: 0;
            }

            .three-column-layout[data-layout-orientation="landscape"] .map-controls-outlet {
                position: absolute;
                left: 1rem;
                bottom: 1rem;
                margin-top: 0;
                width: auto;
                max-width: calc(100% - 2rem);
                z-index: 2;
            }

            .three-column-layout[data-layout-orientation="landscape"] .map-controls-outlet #mapControls {
                margin: 0;
                max-width: 100%;
                transform: none;
            }
        }

        @media (max-width: 640px) {
            header .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            main .mx-auto {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            body {
                background-position: center;
            }
        }

        .player-table-wrapper {
            background-color: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(71, 85, 105, 0.55);
        }

        .player-table {
            width: max-content;
            min-width: 100%;
        }

        .player-table thead th {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.88));
            color: rgb(226, 232, 240);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .player-table-row {
            transition: background-color 160ms ease, color 160ms ease;
        }

        .player-table-row-band-0 {
            background-color: rgba(15, 23, 42, 0.78);
        }

        .player-table-row-band-1 {
            background-color: rgba(30, 41, 59, 0.78);
        }

        .player-table-row:hover {
            background-color: rgba(34, 197, 94, 0.12);
        }

        .player-table-row-dead {
            background-color: rgba(96, 36, 24, 0.74);
        }

        .player-table-row-dead td {
            color: rgb(254, 215, 170);
        }

        .player-table-row-dead:hover {
            background-color: rgba(124, 45, 18, 0.82);
        }

        .player-table-row-down {
            background-color: rgba(51, 65, 85, 0.86);
        }

        .player-table-row-down td {
            color: rgb(148, 163, 184);
        }

        .player-table-row-down:hover {
            background-color: rgba(71, 85, 105, 0.9);
        }
    </style>
</head>

<body class="h-full text-slate-100 flex flex-col overflow-hidden">
<header class="w-full border-b border-slate-800/60 bg-slate-950/60 backdrop-blur-xl">
    <div class="mx-auto flex w-full max-w-7xl flex-col gap-2 px-3 py-3 sm:px-4 lg:flex-row lg:items-end lg:gap-6">
        <div class="flex items-start gap-4">
            <div class="flex size-12 items-center justify-center rounded-2xl bg-slate-900/80 ring-1 ring-emerald-500/40">
                <img data-role="brand-logo" data-asset-name="default.png" alt="HOOZi" class="h-8 w-8 object-contain" draggable="false" referrerpolicy="origin">
            </div>
            <div class="space-y-1">
                <h1 class="text-2xl font-semibold text-white sm:text-3xl" data-i18n="header.title">HOOZi 3.0 网页雷达</h1>
                <div class="flex items-center gap-1.5 text-[0.7rem] text-slate-400">
                    <span data-i18n="header.connectionStatusLabel">连接状态</span>
                    <span data-role="status-indicator"
                          class="size-2.5 rounded-full bg-slate-500 shadow-inner shadow-black/50 transition"></span>
                    <span data-role="status-text" class="text-[0.75rem] font-medium text-slate-200" data-i18n="status.waiting">
                            等待连接
                        </span>
                </div>
            </div>
        </div>
        <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-end sm:justify-end lg:ml-auto lg:w-auto">
            <div class="flex w-full flex-wrap items-center justify-end gap-2 lg:flex-nowrap">
                <div class="flex shrink-0 items-center gap-1 rounded-2xl border border-slate-800/70 bg-slate-950/60 p-1.5 shadow-inner shadow-black/10">
                    <button id="layoutOrientationLandscape" type="button"
                            aria-pressed="true" data-selected="true"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.layoutLandscape">横屏</button>
                    <button id="layoutOrientationPortrait" type="button"
                            aria-pressed="false" data-selected="false"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.layoutPortrait">竖屏</button>
                </div>
                <div class="flex shrink-0 items-center gap-1 rounded-2xl border border-slate-800/70 bg-slate-950/60 p-1.5 shadow-inner shadow-black/10">
                    <button id="menuVisibleToggle" type="button"
                            aria-pressed="true" data-selected="true"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.showMenu">显示菜单栏</button>
                    <button id="playerTableVisibleToggle" type="button"
                            aria-pressed="true" data-selected="true"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.showPlayerTable">显示玩家信息列表</button>
                </div>
                <div class="flex shrink-0 items-center gap-1 rounded-2xl border border-slate-800/70 bg-slate-950/60 p-1.5 shadow-inner shadow-black/10">
                    <button id="viewModeFree" type="button"
                            aria-pressed="false" data-selected="false"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.viewModeFree">自由视角</button>
                    <button id="viewModeFollow" type="button"
                            aria-pressed="true" data-selected="true"
                            class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                            data-i18n="header.viewModeFollow">固定跟随</button>
                </div>
                <div class="flex w-[160px] shrink-0">
                    <select id="sel_player" autocomplete="off"
                            class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2 text-sm font-medium text-slate-100 outline-none focus:border-emerald-400/70 focus:ring-2 focus:ring-emerald-500/40">
                        <option value="">—</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</header>
<main class="w-full flex-1">
    <div class="three-column-layout mx-auto w-full px-1 pb-1 sm:px-2"
         data-role="layout" data-layout-orientation="landscape" data-menu-visible="true" data-table-visible="true">
        <aside class="config-column w-full overflow-y-auto overscroll-auto">
            <div class="config-stack flex flex-1 flex-col space-y-2">
                <section class="glass-panel rounded-3xl py-2 px-4" data-role="connection-config">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.connection">连接配置</h2>
                        <div class="flex flex-wrap items-center gap-2">
                            <div class="flex shrink-0 items-center gap-1 rounded-2xl border border-slate-800/70 bg-slate-950/60 p-1.5 shadow-inner shadow-black/10">
                                <button id="connectionModeAuto" type="button"
                                        aria-pressed="true" data-selected="true"
                                        class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                                        data-i18n="config.connectionAuto">自动</button>
                                <button id="connectionModeManual" type="button"
                                        aria-pressed="false" data-selected="false"
                                        class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 data-[selected=true]:border-emerald-400 data-[selected=true]:bg-emerald-500/10 data-[selected=true]:text-emerald-300"
                                        data-i18n="config.connectionManual">手动</button>
                            </div>
                            <button id="configReconnectButton" type="button"
                                    class="shrink-0 rounded-full border border-emerald-500/60 bg-emerald-500/10 px-3 py-1 text-[0.7rem] font-semibold text-emerald-300 transition hover:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/60"
                                    data-i18n="map.reconnect">重连</button>
                        </div>
                    </div>
                    <div class="mt-3 space-y-3 hidden" data-role="connection-manual-fields">
                        <div class="grid grid-cols-3 gap-3 text-sm text-slate-300">
                            <label class="col-span-1 space-y-1.5">
                                <span class="block text-xs font-semibold uppercase tracking-wide text-slate-400" data-i18n="config.protocol">协议</span>
                                <div class="relative">
                                    <select id="conf_protocol" autocomplete="off"
                                            class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm font-medium text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                                        <option value="ws">ws</option>
                                        <option value="wss">wss</option>
                                    </select>
                                    <div id="conf_protocol_readonly"
                                         class="hidden w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm font-medium text-slate-100">
                                        wss
                                    </div>
                                </div>
                            </label>
                            <label class="col-span-2 space-y-1.5">
                                <span class="block text-xs font-semibold uppercase tracking-wide text-slate-400" data-i18n="config.host">IP地址/域名</span>
                                <input id="conf_host" type="text" autocomplete="off"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                            <label class="col-span-1 space-y-1.5">
                                <span class="block text-xs font-semibold uppercase tracking-wide text-slate-400" data-i18n="config.port">端口</span>
                                <input id="conf_port" type="number" min="1" step="1" autocomplete="off"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                            <label class="col-span-2 space-y-1.5">
                                <span class="block text-xs font-semibold uppercase tracking-wide text-slate-400" data-i18n="config.path">路径</span>
                                <input id="conf_path" type="text" autocomplete="off"
                                       class="w-full rounded-xl border border-slate-700/70 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 focus:border-emerald-400/70 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
                            </label>
                        </div>
                    </div>
                </section>
                <section class="glass-panel rounded-3xl py-2 px-4">
                    <h2 class="text-sm font-semibold uppercase text-slate-300" data-i18n="config.toggles">信息开关</h2>
                    <div class="mt-3 space-y-2">
                        <div class="grid grid-cols-2 gap-1.5 text-sm text-slate-200">
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showname" type="checkbox" data-setting="showName"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleName">昵称</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showlegend" type="checkbox" data-setting="showLegend"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleLegend">传奇</span>
                            </label>
                            <label class="flex items-center gap-2 rounded-xl border border-slate-800/70 bg-slate-950/40 px-2.5 py-1.5">
                                <input id="conf_showhealth" type="checkbox" data-setting="showHealth"
                                       class="size-4 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-500/60">
                                <span data-i18n="config.toggleHealth">血量</span>

                <div class="relative z-10 flex items-center justify-between gap-3 overflow-x-auto py-1" data-role="player-table-toolbar">
                    <h2 class="shrink-0 pl-2 text-sm font-semibold uppercase text-slate-300" data-i18n="table.title">玩家信息列表</h2>
                    <div class="flex shrink-0 items-center gap-1.5">
                        <input id="importPlayerDataInput" type="file" accept=".json,application/json" class="hidden">
                        <button id="importPlayerDataButton" type="button"
                                class="shrink-0 rounded-full border border-slate-700/70 bg-slate-900/60 px-3 py-1 text-[0.7rem] font-semibold text-slate-300 transition hover:border-emerald-400/60 hover:text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
                                data-i18n="config.importPlayerData">导入玩家数据</button>
                        <button id="exportPlayerDataButton" type="button" disabled
                                class="shrink-0 rounded-full border border-slate-700/70 bg-slate-900/60 px-3 py-1 text-[0.7rem] font-semibold text-slate-300 transition hover:border-slate-500/60 hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-500/30 disabled:cursor-not-allowed disabled:opacity-50"
                                data-i18n="config.exportCurrentPlayers">导出当前玩家信息</button>
                    </div>
                </div>
                <p id="playerDataMessage" hidden role="status" aria-live="polite"></p>
                <div class="player-table-wrapper mt-3 flex-1 overflow-hidden rounded-2xl" data-role="player-table-wrapper">
                    <div class="h-full overflow-auto" data-role="player-table-scroll">
                        <table class="player-table w-full text-sm text-slate-200">
                            <thead>
                            <tr data-role="player-table-header"></tr>
                            </thead>
                            <tbody data-role="player-table-body">
                            <tr data-role="player-table-empty">
                                <td data-role="player-table-empty-cell" class="px-2.5 py-5 text-center text-xs text-slate-500" data-i18n="table.empty">等待玩家数据</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<footer class="w-full py-0.5 sm:py-1 border-t border-slate-800/60 bg-slate-950/80 backdrop-blur-xl text-xs text-slate-700">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-center items-center sm:space-x-3 px-3">
        <p data-i18n="footer.copyright">Copyright © hoozi.net 版权所有</p>
        <p data-i18n="footer.disclaimer">所有其他商标、标志及著作权均为其各自所有者所有</p>
    </div>
</footer>

<script type="module" data-app-bootstrap>
    if (window.location.protocol === 'file:') {
        const language = navigator.language || 'en';
        const traditional = language.startsWith('zh-TW') || language.startsWith('zh-HK') || language.startsWith('zh-MO');
        const simplified = language.startsWith('zh') && !traditional;
        const copy = traditional
            ? {
                title: '需要本機 HTTP 伺服器',
                subtitle: '瀏覽器不允許透過 file:// 載入 ES Modules。請在專案目錄執行 npm start，然後開啟 http://127.0.0.1:8080/。',
                status: '啟動方式錯誤'
            }
            : simplified
                ? {
                    title: '需要本地 HTTP 服务器',
                    subtitle: '浏览器不允许通过 file:// 加载 ES Modules。请在项目目录执行 npm start，然后打开 http://127.0.0.1:8080/。',
                    status: '启动方式错误'
                }
                : {
                    title: 'Local HTTP server required',
                    subtitle: 'Browsers cannot load ES Modules through file://. Run npm start in the project directory, then open http://127.0.0.1:8080/.',
                    status: 'Invalid launch method'
                };
        const overlay = document.getElementById('mapOverlay');
        overlay.dataset.state = 'info';
        overlay.dataset.reconnect = 'false';
        document.getElementById('overlayTitle').textContent = copy.title;
        document.getElementById('overlaySubtitle').textContent = copy.subtitle;
        document.querySelector('[data-role="status-text"]').textContent = copy.status;
        const indicator = document.querySelector('[data-role="status-indicator"]');
        indicator.classList.remove('bg-slate-500');
        indicator.classList.add('bg-rose-500');
        console.info(copy.subtitle);
    } else {
        import('./src/main.js').catch((error) => {
            console.error('Failed to load HOOZi radar modules', error);
            const overlay = document.getElementById('mapOverlay');
            overlay.dataset.state = 'info';
            overlay.dataset.reconnect = 'false';
            document.getElementById('overlayTitle').textContent = 'Module load failed';
            document.getElementById('overlaySubtitle').textContent = error instanceof Error ? error.message : String(error);
        });
    }
</script>

</body>
</html>
